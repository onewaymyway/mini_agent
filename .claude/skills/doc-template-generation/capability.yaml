skill_type: generative-capability
name: doc-template-generation

# 第一级免LLM匹配规则（零成本，命中优先）。
# 具体的 pattern/keyword 值来自各 member 目录下 _index.json 中的 "match" 字段。
domain_matchers:
  - type: keyword
    field: target.template_name
  - type: keyword
    field: text

# [FIX] 见 text-transform-capability/capability.yaml 里的同名注释：
# request_formats 让 resolve() 之前多一道零成本的形状检查，形状不对时
# 直接返回 invalid_request + example，不会被误判成"需要探索新模板"。
request_formats:
  - name: doc_generate_request
    description: >
      按指定模板生成一份文档。text 放生成意图的自然语言描述（用于一级
      关键词匹配/二级 LLM 裁决，需包含模板相关关键词），模板名放
      target.template_name，生成文档所需的结构化数据放 content。
    required_fields: [text, target.template_name]
    example:
      text: "生成一份周报"
      target: {template_name: "weekly-report"}
      content: {}

# 该领域所有 member 输出必须满足的 schema 结构约束模板。
intent_schema_template:
  type: object
  required: [document]
  properties:
    document:
      type: object
      required: [format, sections]
      properties:
        format:
          type: string
        sections:
          type: array

# 探索阶段配置（复用与 browser-site-scraper 相同的引擎接线；
# base_tools 换成本领域自己的底层原语声明，占位，尚未实现）。
explorer:
  base_tools: [doc-core]
  prompt: explorer/prompt.md
  tool_allowlist: explorer/tool_allowlist.json
  max_steps: 25
  max_seconds: 120

# member 的统一函数入口约定，引擎按此调用，通常无需改动。
member_interface:
  entrypoint: "run(input: dict) -> dict"

# 生命周期阈值（可覆盖引擎默认值）。
lifecycle:
  probation_success_threshold: 3
  degrade_failure_threshold: 3
  dead_after_reexplore_fail: true
  # 以下两项供 _engine/health_patrol.py 使用：
  health_patrol_stale_days: 30
  health_patrol_dead_retention_days: 14
