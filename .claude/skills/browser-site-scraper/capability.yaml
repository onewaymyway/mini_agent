skill_type: generative-capability
name: browser-site-scraper

# 第一级免LLM匹配规则（零成本，命中优先）。
# 具体的 pattern/keyword 值来自各 member 目录下 _index.json 中的 "match" 字段。
domain_matchers:
  - type: domain_pattern
    field: target.url
  - type: keyword
    field: text

# [FIX] 见 text-transform-capability/capability.yaml 里的同名注释：
# request_formats 让 resolve() 之前多一道零成本的形状检查，形状不对时
# 直接返回 invalid_request + example，不会被误判成"需要探索新站点"。
request_formats:
  - name: scrape_request
    description: >
      对指定站点发起一次抓取请求。text 放本次抓取意图的自然语言描述
      （用于一级关键词匹配/二级 LLM 裁决），目标站点 URL 放 target.url，
      需要提取的信息放 query。
    required_fields: [text, target.url]
    example:
      text: "抓取知乎某个问题下的高赞回答"
      target: {url: "https://www.zhihu.com/question/xxxxxxxx"}
      query: "高赞回答的正文内容"

# 该领域所有 member 输出必须满足的 schema 结构约束模板。
intent_schema_template:
  type: object
  required: [results]
  properties:
    results:
      type: array

# 探索阶段配置（阶段三接入，当前先声明配置占位，供引擎读取但尚未生效）。
# [阶段二十/阶段三] 探索器已切换到 SubAgent 驱动，预算改为
# orchestrator.task.Task.max_turns，字段名同步改为 max_turns；原先靠自造
# 计时循环维护的 max_seconds 墙钟预算与"剩余时间<30s 提醒"机制（阶段十九）
# 一并移除，不再需要——单步工具调用的耗时兜底交给工具自身超时机制
# （browser_navigate 默认 20s、browser_wait_for_selector 默认 8s，均在
# browser-core 内部实现），引擎层不再重复限时。40 个回合对真实探索（一步=
# 一次 LLM 往返+一次浏览器操作）通常足够走到 report_failure/finish，比旧的
# 300s 墙钟预算更贴合"探索子agent到底做了多少事"这个真实约束维度，而不是
# 一个容易被网络抖动/LLM排队吃掉的时间数字。
# tool_allowlist.json 里声明的 browser_navigate 等工具名现在会被桥接为
# 探索用 SubAgent 上的真实工具，探索子agent同时还能用 bash/python 等系统
# 通用工具兜底（例如解析非标准页面结构、临时写个脚本核对提取结果）。
explorer:
  base_tools: [browser-core]
  prompt: explorer/prompt.md
  tool_allowlist: explorer/tool_allowlist.json
  max_turns: 40
  preferred_primitives:
    - browser_navigate
    - browser_extract_content
    - browser_wait_for_selector
    - browser_click
    - browser_type

# member 的统一函数入口约定，引擎按此调用，通常无需改动。
member_interface:
  entrypoint: "run(input: dict) -> dict"

# 蒸馏一致性兜底开关（阶段六新增；阶段二十五起为 browser-site-scraper 打开）：
# 仅当探索阶段最后一个真实工具步骤未能直接给出 data 时，是否信任探索阶段
# 已通过 intent_schema 校验的 trace.data 作为蒸馏脚本的兜底常量。真实
# browser-core 的提取类工具（如 browser_extract_content）通常最后一步就会
# 返回 data，理论上不需要这道兜底；但真实探索经常会在拿到数据前先走一段
# 探测性弯路（试 bash/curl、换 selector 等），trace-replay 重放到这些弯路
# 步骤时容易在 sandbox 自测阶段就失败——此时哪怕最终数据早已被
# intent_schema 校验通过，也会因为"重放中间步骤失败"整体判负，白白丢弃一次
# 本可沉淀的成功探索（阶段二十四实际复现过的问题）。权衡之后打开这道兜底：
# 即使重放没能在自测里复现出 data，也允许用探索阶段已验证过的数据顶上，
# 代价是 trace-replay 产出的脚本可能不是"完全可信地参数化复用"，而更接近
# "这次探索确实拿到了正确数据，但脚本的重放骨架未必百分百可靠"——这个事实
# 会如实记录进 meta.json 的 distill_used_trace_data_fallback 字段，保持可
# 审计，不是静默放宽标准。真正的长期修复方向仍是阶段二十五新增的
# script_source 结构性必填 + LLM 事后总结路径（见 distiller.py 文件头），
# trace-replay 只是三条路径里的最后兜底。
distill:
  trust_trace_data: true

# 生命周期阈值（可覆盖引擎默认值）。
lifecycle:
  probation_success_threshold: 3
  degrade_failure_threshold: 3
  dead_after_reexplore_fail: true
  # 以下两项供 _engine/health_patrol.py 使用（阶段四）：
  health_patrol_stale_days: 30        # 超过N天无任何成功/失败记录，标记为"长期未调用"
  health_patrol_dead_retention_days: 14  # dead 状态保留N天供人工审查，超过后建议/可清理
