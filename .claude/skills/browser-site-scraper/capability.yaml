skill_type: generative-capability
name: browser-site-scraper

# 第一级免LLM匹配规则（零成本，命中优先）。
# 具体的 pattern/keyword 值来自各 member 目录下 _index.json 中的 "match" 字段。
domain_matchers:
  - type: domain_pattern
    field: target.url
  - type: keyword
    field: text

# [FIX] 见 text-transform-capability/capability.yaml 里的同名注释：
# request_formats 让 resolve() 之前多一道零成本的形状检查，形状不对时
# 直接返回 invalid_request + example，不会被误判成"需要探索新站点"。
request_formats:
  - name: scrape_request
    description: >
      对指定站点发起一次抓取请求。text 放本次抓取意图的自然语言描述
      （用于一级关键词匹配/二级 LLM 裁决），目标站点 URL 放 target.url，
      需要提取的信息放 query。
    required_fields: [text, target.url]
    example:
      text: "抓取知乎某个问题下的高赞回答"
      target: {url: "https://www.zhihu.com/question/xxxxxxxx"}
      query: "高赞回答的正文内容"

# 该领域所有 member 输出必须满足的 schema 结构约束模板。
intent_schema_template:
  type: object
  required: [results]
  properties:
    results:
      type: array

# 探索阶段配置（阶段三接入，当前先声明配置占位，供引擎读取但尚未生效）。
explorer:
  base_tools: [browser-core]
  prompt: explorer/prompt.md
  tool_allowlist: explorer/tool_allowlist.json
  max_steps: 40
  max_seconds: 180

# member 的统一函数入口约定，引擎按此调用，通常无需改动。
member_interface:
  entrypoint: "run(input: dict) -> dict"

# 蒸馏一致性兜底开关（阶段六新增，默认关闭，见 next_doc 方案文档阶段五"已知
# 遗留"第 1 条 / _engine/distiller.py 文件头说明）：
# 仅当探索阶段最后一个真实工具步骤未能直接给出 data 时，是否信任探索阶段
# 已通过 intent_schema 校验的 trace.data 作为蒸馏脚本的兜底常量。真实
# browser-core 的提取类工具（如 browser_extract_content）通常最后一步就会
# 返回 data，生产环境不需要开启；仅建议在自测/CI 用任意回显式桩工具执行器时
# 临时开启，避免"自测环境没配对"被误判为"探索失败"。
distill:
  trust_trace_data: false

# 生命周期阈值（可覆盖引擎默认值）。
lifecycle:
  probation_success_threshold: 3
  degrade_failure_threshold: 3
  dead_after_reexplore_fail: true
  # 以下两项供 _engine/health_patrol.py 使用（阶段四）：
  health_patrol_stale_days: 30        # 超过N天无任何成功/失败记录，标记为"长期未调用"
  health_patrol_dead_retention_days: 14  # dead 状态保留N天供人工审查，超过后建议/可清理
