[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests (mock CDP session)
    integration: Integration tests (require real browser)
    e2e: End-to-end tests (require real browser)
    browser: Tests that require a browser instance
    slow: Slow running tests
