skill_type: generative-capability
name: text-transform-capability

# 第一级免LLM匹配规则（零成本，命中优先）。
# 具体的 keyword 值来自各 member 目录下 _index.json 中的 "match" 字段。
domain_matchers:
  - type: keyword
    field: target.op
  - type: keyword
    field: text

# [FIX] agent 调用方常犯的错误：把待处理内容直接塞进 text（text 其实是
# 用于一级关键词匹配/二级 LLM 裁决的"意图描述"），或者自己发明一个不存在
# 的字段名（如 transformation）代替 target.op。声明 request_formats 后，
# 引擎在 resolve 之前会先做一次零成本的形状检查，形状不对时直接返回
# invalid_request + 本处的 example，不会被误判成"需要探索新能力"。
request_formats:
  - name: transform_request
    description: >
      对一段文本做一次变换（已知的 upper/reverse，或触发探索一个新变换）。
      text 放"这次要做什么"的自然语言描述，必须包含操作类关键词（如
      "转大写"/"反转"），供一级关键词匹配命中；实际要变换的原始文本放在
      content.text，不要直接塞进 text。
    required_fields: [text, target.op, content.text]
    example:
      text: "把这段文字转大写"
      target: {op: "upper"}
      content: {text: "hello world"}

# 该领域所有 member 输出必须满足的 schema 结构约束模板。
intent_schema_template:
  type: object
  required: [result]
  properties:
    result:
      type: object
      required: [text]
      properties:
        text:
          type: string

# 探索阶段配置（复用与 browser-site-scraper / doc-template-generation 相同的
# 引擎接线；base_tools 是本领域自己的底层原语声明，占位，尚未实现，测试时用
# 桩探索器 + 桩 tool_executor 验证接线逻辑）。
# [阶段二十/阶段三] 探索器已切换到 SubAgent 驱动（见 explorer_runtime.py::
# build_subagent_explorer()）：预算字段改名 max_steps -> max_turns，直接
# 对应 orchestrator.task.Task.max_turns；不再有 max_seconds 这个独立的
# 墙钟时间预算（原实现是引擎自己在决策循环里计时，现在改为复用 SubAgent
# 既有的回合预算机制，不再自造）。tool_allowlist.json 里声明的
# text_transform_apply 现在会被桥接为探索用 SubAgent 上的真实工具，探索
# 子agent同时还能用 bash/python 等系统通用工具。
explorer:
  base_tools: [text-core]
  prompt: explorer/prompt.md
  tool_allowlist: explorer/tool_allowlist.json
  max_turns: 10

# member 的统一函数入口约定，引擎按此调用，通常无需改动。
member_interface:
  entrypoint: "run(input: dict) -> dict"

# 生命周期阈值（可覆盖引擎默认值）。刻意设得比另外两个 skill 更小
# （2 而不是 3），让测试文档里"连续失败触发 degraded"的场景只需要
# 2 次调用就能复现，降低测试成本。
lifecycle:
  probation_success_threshold: 2
  degrade_failure_threshold: 2
  dead_after_reexplore_fail: true
  # 以下两项供 health_patrol 使用：
  health_patrol_stale_days: 30
  health_patrol_dead_retention_days: 14

# 蒸馏一致性兜底开关（阶段六新增）。本 skill 用于测试的桩 tool_executor
# 通常直接回显参数、不一定在重放最后一步返回 data，因此默认打开，
# 避免测试探索场景时踩阶段五记录过的"桩执行器不友好"的坑。
distill:
  trust_trace_data: true
