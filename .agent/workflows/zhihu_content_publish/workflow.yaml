# zhihu_content_publish — 分析文档 → 知乎搜索候选问题 → 批量LLM筛选 → 补全详情
#
# 遵循 next_doc/workflow_authoring_guide.md 的规范：
#   - prompt 一律外置到 prompts/*.md（本文件不写超过 3 行的内联 prompt）
#   - python_step 的脚本代码外置到 steps/*.py
#   - 每个 step 都声明 output_file，产出统一落在本次 workflow session 的
#     output/ 目录下（.agent/workflow_sessions/<wfs_id>/output/），不需要
#     用户或脚本自己拼路径
#
# 运行前置条件：
#   - agent_config.json 的 workflow 节需要设置 "python_step_enabled": true
#     （python_step 默认关闭，见 next_doc/workflow_python_step_and_zhihu_publish_plan.md §B4）
#   - 需要先手动运行一次 `python steps/launch_zhihu_logged_in.py` 启动一个
#     已登录知乎的浏览器实例（固定调试端口 9336），并在弹出的浏览器窗口里
#     完成登录；登录态会持久化在 steps/temp_data/zhihu_logged_in_profile
#     目录，之后重复运行同一命令会自动带着登录态，不需要每次都重新登录。
#   - 运行参数：run_workflow(inputs={"doc_path": "<本地文档绝对路径>"})
#
# [browser-cdp 依赖清理] 本 workflow 原来依赖 .claude/skills/browser-cdp/
# skill（search_zhihu 步骤是挂载它的 skill_agent，enrich_questions 步骤 sys.path
# 注入它的 cdp_client 模块）。browser-cdp 即将从项目中移除，本 workflow 已把
# 实际用到的那一小部分 CDP 收发/搜索/登录启动逻辑原样搬进本目录下的
# steps/_cdp_client.py、steps/02_search_zhihu.py、
# steps/launch_zhihu_logged_in.py，不再依赖 .claude/skills/ 下任何目录，
# 也不再需要挂载任何 skill。
#
# [修复记录] python_step 的 `step.params` 字段是纯字面量透传（executors.py::
# PythonStepExecutor.execute 直接 `step.params or {}` 序列化给子进程），不会
# 像 prompt 一样做 {doc_path} 占位符替换——原先 analyze_doc 写
# `params: {doc_path: "{doc_path}"}` 是无效写法，脚本实际收到的是字面量字符串
# "{doc_path}"，每次运行都会在 Path(...).exists() 处报 FileNotFoundError。
# 改法：新增一个 `intake`（type: human_input, input_key: doc_path）step 接收
# run_workflow(inputs={"doc_path": ...}) 传入的值（命中 input_key 时直接取值、
# 不阻塞等待），analyze_doc 通过 depends_on + ctx.input_output("intake") 读取，
# 这是当前版本 python_step 获取 workflow 级 inputs 参数的标准方式（做法与
# docs/workflow-guide.md"全自动执行模式"一节里 intake→run_checks 的例子一致）。

# [数据传递优化] analyze_doc 除了在 doc_analysis.json 里返回 search_keywords
# 数组本身，还额外用 ctx.write_output() 落一份 search_keywords.json（纯 JSON
# 数组，符合 zhihu_search_with_login.py --keywords-file 的输入格式），并把
# 这份文件的绝对路径放进返回值的 keywords_file 字段。search_zhihu 步骤的
# prompt 直接引用 {analyze_doc.output} 里的 keywords_file 路径传给
# --keywords-file，不需要 agent 在对话轮里自己从 search_keywords 现算一份
# 关键词文件——少一次没必要的"临场造文件"操作，也避免抄错/漏抄关键词。

name: zhihu_content_publish
description: 分析本地文档内容，去知乎搜索适合作为答案的问题，批量LLM筛选后补全详情
version: "1.0"
mode: interactive

defaults:
  retry_on_error: 1

steps:
  - id: intake
    type: human_input
    input_key: doc_path            # 命中 run_workflow(inputs={"doc_path": ...}) 时直接取值，不阻塞
    input_prompt: "本次要分析并发布到知乎的本地文档绝对路径"
    prompt: "doc_path"

  - id: validate_input
    type: python_step
    script_path: steps/00_validate_input.py
    depends_on: [intake]
    output_file: input_validation.json
    timeout: 30
    retry_on_error: 0

  - id: analyze_doc
    type: python_step
    script_path: steps/01_analyze_doc.py
    depends_on: [intake, validate_input]
    output_file: doc_analysis.json
    timeout: 300
    retry_on_error: 1

  - id: search_zhihu
    # [browser-cdp 依赖清理] 原来是 skill_agent（挂载 browser-cdp skill，让
    # LLM 子agent自己决定怎么调用其搜索脚本）。实际搜索逻辑是确定性的
    # （给定关键词 -> 打开知乎搜索页 -> 滚动加载 -> 提取结果），不需要每次
    # 都走一轮 LLM 决策，改成 python_step 直接跑 steps/02_search_zhihu.py，
    # 不再依赖 browser-cdp、也更快更稳定（跟 enrich_questions 当年从
    # skill_agent 改 python_step 是同一个理由）。
    type: python_step
    script_path: steps/02_search_zhihu.py
    depends_on: [analyze_doc]
    output_file: search_results_data.json
    params:
      cdp_port: 9336                # 对应 launch_zhihu_logged_in.py 起的已登录实例
      min_results: 30
      max_results: 60
      max_scrolls: 12
      scroll_pause: 3.0
    timeout: 900
    retry_on_error: 1

  - id: filter_questions
    type: python_step
    script_path: steps/03_filter.py
    depends_on: [analyze_doc, search_zhihu]
    output_file: filtered_questions.json
    timeout: 600
    retry_on_error: 1

  - id: enrich_questions
    # [改进 v1] 原来是 skill_agent（每个问题一整轮 browser-cdp 多轮对话），几十个
    # 问题下来非常慢。改成 python_step：开网页/抓文本这类纯操作用 Python 直接调
    # CDP 完成，"从抓到的文本里挑出具体字段"这一步调用 LLM。
    # [改进 v2] 这些字段其实大多能直接从知乎问题详情页的固定 DOM 结构里解析出来
    # （回答数/关注数/被浏览数/最高赞回答的作者-点赞数-正文，都是明确的选择器），
    # 不需要每题都调一次 LLM"猜"。于是进一步改成：先用 JS 选择器 + 正则精确解析，
    # 只有个别选择器解析不到的字段（目前主要是 created_or_active_time，没有稳定
    # 选择器）才针对那几个缺失字段单独调一次 LLM 兜底，而不是每题固定问全部字段。
    # 详见 steps/05_enrich_questions.py 顶部注释。返回值直接写入 output_file，
    # 不再需要 skill_agent 的 result_file 校验契约。
    #
    # 断点续抓：脚本每处理完一个问题就落一次 enrich_progress.json 进度文件，
    # 重跑本 step（比如部分问题因网络抖动失败）会自动跳过已成功的问题，只
    # 补抓剩下的部分。
    type: python_step
    script_path: steps/05_enrich_questions.py
    depends_on: [filter_questions]
    output_file: final_result.json
    params:
      cdp_port: 9336                # 对应 launch_zhihu_logged_in.py 起的已登录实例
    timeout: 1800
    retry_on_error: 1
