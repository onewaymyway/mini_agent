name: mechanism_validation_demo
description: 验证 workflow 机制改进 P12-P15 全部新特性的端到端 demo：script 的 result_file structured
  模式（P15）、foreach 批处理（P13）、wait 可中断等待（P13）、merge 的三种汇聚策略（P14）、tool_call 占位符入参 （P12
  Phase2）、{step_id.result_file:path} 字段级占位符（P12 Phase3）、 以及 condition 表达式的正常求值路径。运行前请确认已开启
  agent_config.json 里的 script_step_enabled / python_step_enabled， 见本目录 README.md。
version: '1.0'
steps:
- id: generate_words
  name: 生成候选词列表（script，result_file）
  prompt: 生成一份固定的候选词列表，写入 result_file（本 step 不使用 prompt，仅用于满足字段要求）
  timeout: 30.0
  type: script
  script: "python -c \"\nimport json, os\nwords = ['alpha', 'beta', 'gamma', 'delta']\n\
    print('generate_words: producing %d words' % len(words))\nwith open(os.environ['WORKFLOW_RESULT_FILE_PATH'],\
    \ 'w', encoding='utf-8') as f:\n    json.dump({'words': words}, f, ensure_ascii=False)\n\
    \"\n"
  result_file: words_data.json
  result_file_required_keys:
  - words
- id: compute_stats
  name: 生成一份独立统计信息（script，result_file）
  prompt: 生成一份独立的统计信息，写入 result_file（本 step 不使用 prompt，仅用于满足字段要求）
  timeout: 30.0
  type: script
  script: "python -c \"\nimport json, os, datetime\ndata = {\n    'generated_by':\
    \ 'compute_stats',\n    'timestamp': datetime.datetime.utcnow().isoformat(),\n\
    }\nwith open(os.environ['WORKFLOW_RESULT_FILE_PATH'], 'w', encoding='utf-8') as\
    \ f:\n    json.dump(data, f, ensure_ascii=False)\nprint('compute_stats: wrote\
    \ result file')\n\"\n"
  result_file: stats_data.json
  result_file_required_keys:
  - generated_by
  - timestamp
- id: pause_before_batch
  name: 批处理前的限速等待
  prompt: ''
  depends_on:
  - generate_words
  type: wait
  wait_seconds: 2.0
- id: enrich_each_word
  name: 逐词批量处理
  prompt: ''
  depends_on:
  - generate_words
  - pause_before_batch
  type: foreach
  items: '{generate_words.result_file:words}'
  foreach_step:
    type: agent
    max_turns: 4
    prompt: '给定单词 "{item}"（这是列表里第 {item_index} 个，从 0 开始）。

      只输出一个 JSON object（不要有任何多余文字/解释/代码块围栏），

      包含三个字段：word（原词）、upper（转成大写）、length（字符长度）。

      '
  foreach_max_concurrency: 2
- id: summarize_report
  name: 汇总批处理结果
  prompt: ''
  depends_on:
  - enrich_each_word
  - generate_words
  timeout: 60.0
  type: python_step
  script_path: E:\codes\mini_claude_code\.agent\workflows\mechanism_validation_demo\steps\summarize.py
  output_file: summary.json
- id: merge_words_and_stats
  name: 合并词表与统计信息（json_merge）
  prompt: ''
  depends_on:
  - generate_words
  - compute_stats
  type: merge
  merge_sources:
  - generate_words
  - compute_stats
  merge_strategy: json_merge
  merge_use_result_file: true
- id: merge_array_demo
  name: 把两份 result_file 组成 JSON 数组（json_array）
  prompt: ''
  depends_on:
  - generate_words
  - compute_stats
  type: merge
  merge_sources:
  - generate_words
  - compute_stats
  merge_strategy: json_array
  merge_use_result_file: true
- id: notify_tool_call
  name: 用 tool_call 直接写一份通知文件
  prompt: 写一份通知文件（本 step 使用 tool_args，不使用 prompt 本身，仅用于满足字段要求）
  depends_on:
  - generate_words
  - summarize_report
  type: tool_call
  tool_name: write_file
  tool_args:
    path: mechanism_validation_notify.txt
    content: '- 校验流程已完成。词表第一个词是「{generate_words.result_file:words[0]}」，汇总文件落盘于：{summarize_report.output_file}'
- id: merge_final_report
  name: 拼接最终报告
  prompt: ''
  depends_on:
  - summarize_report
  - notify_tool_call
  - merge_words_and_stats
  type: merge
  merge_sources:
  - summarize_report
  - notify_tool_call
  - merge_words_and_stats
  merge_separator: '

    ---

    '
- id: optional_conclusion
  name: 生成一句话结论（条件成立才执行）
  prompt: '根据以下汇总内容，用中文写一句不超过 50 字的结论：


    {merge_final_report.output}


    补充参考（result_file 字段级占位符）：本次词表第一个词是

    "{generate_words.result_file:words[0]}"。

    '
  depends_on:
  - merge_final_report
  - generate_words
  condition: merge_final_report.output != ''
  type: agent
