[project]
name = "mini-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.34.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0",
    "httpx>=0.27",
    "json_repair",
]

[project.optional-dependencies]
http = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=1.8.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
mini-agent = "mini_agent.cli.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
