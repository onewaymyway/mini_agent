# project.yaml — article_garden 与 daemon 之间的契约（字段规范见 src/mini_agent/external_projects/manifest.py）。
# 当前为 P6：文章导入、单篇摘要（增量）、章程草稿反推、概念与关系、知识树与覆盖度、缺口检测与选题、资料收集、成文与审阅。
# 默认不登记 cron：摘要与章程草稿会调用模型，属于高成本操作，由你在看板或命令行手动触发；
# 定时 cycle 在 P7 提供，届时也须在文章库设置里显式打开。
# 参数按声明顺序以位置参数追加在 cmd 后面；其它选项（如 --article-id、--apply）请直接在命令行使用，见 docs/USAGE.md。

name: article_garden

entrypoints:
  list_domains:
    cmd: "python entrypoints/list_domains.py"
    timeout_sec: 60
    concurrency: unmanaged      # 不调 LLM 的纯脚本
  create_domain:
    cmd: "python entrypoints/create_domain.py"
    timeout_sec: 60
    concurrency: unmanaged
    params:
      - name: domain_id
        required: true
        help: "文章库 id（小写字母开头，如 ai、finance_cn）"
      - name: name
        required: true
        help: "文章库显示名称，如 人工智能"
      - name: template
        required: false
        default: "blank"
        help: "章程模板：blank / general_tech / ai"
  import_library:
    cmd: "python entrypoints/import_library.py"
    timeout_sec: 300
    concurrency: unmanaged      # 只读写文件，不调 LLM
    params:
      - name: domain_id
        required: true
        help: "文章库 id。导入的路径请在命令行追加：... <domain_id> <路径…> [--apply]"
  digest:
    cmd: "python entrypoints/digest.py"
    timeout_sec: 7200           # 整库增量摘要可能较久；单篇步骤超时由设置项控制
    concurrency: managed        # 调用模型，占用并发槽位
    params:
      - name: domain_id
        required: true
        help: "文章库 id"
  build_wiki:
    cmd: "python entrypoints/build_wiki.py"
    timeout_sec: 7200
    concurrency: managed        # 调用模型（归一确认、定义、关系、冲突）
    params:
      - name: domain_id
        required: true
        help: "文章库 id（需已有摘要成功的文章）"
  build_tree:
    cmd: "python entrypoints/build_tree.py"
    timeout_sec: 3600
    concurrency: managed        # 生成挂载提案时调用模型（无变化则不调用）
    params:
      - name: domain_id
        required: true
        help: "文章库 id（需已有概念）。应用提案请在命令行追加 --apply，或在看板确认"
  plan_topics:
    cmd: "python entrypoints/plan_topics.py"
    timeout_sec: 1800
    concurrency: managed        # 中等相似度判重与开放命题会调用模型；模型未就绪时仍可运行（标记未判重）
    params:
      - name: domain_id
        required: true
        help: "文章库 id。放行/拒绝请在命令行追加 --approve <id> 或 --reject <id> --reason <原因>"
  research:
    cmd: "python entrypoints/research.py"
    timeout_sec: 3600
    concurrency: managed        # 搜索、抓取（访问任意网站）；查询生成可选调用模型
    params:
      - name: domain_id
        required: true
        help: "文章库 id"
      - name: topic_id
        required: true
        help: "选题 id（须已放行或已调研），如 t-0003"
  write_article:
    cmd: "python entrypoints/write_article.py"
    timeout_sec: 3600
    concurrency: managed        # 成文：大纲、逐节初稿、独立评审都调用模型；审阅动作不调用模型
    params:
      - name: domain_id
        required: true
        help: "文章库 id"
      - name: topic_id
        required: true
        help: "选题 id（已调研、成文失败或已成稿），如 t-0003。退回意见、审阅动作请在命令行追加 --feedback / --approve / --publish / --abandon"
  draft_charter:
    cmd: "python entrypoints/draft_charter.py"
    timeout_sec: 1800
    concurrency: managed        # 调用模型
    params:
      - name: domain_id
        required: true
        help: "文章库 id（需已有摘要成功的文章）"

health_check:
  cmd: "python entrypoints/health.py"

resources:
  # 调研（P5 起）会访问搜索结果中的任意网站，域名不固定，因此 allowed_domains 留空；
  # robots.txt 与按域名节流在代码中强制执行（article_garden/research/fetch.py）。
  allowed_domains: []
  max_concurrency: 1

review:
  cadence: weekly
  enabled: false

# Streamlit 看板（端口 8508；8502–8507 已被其它项目占用）。
# 无登录保护且会调用付费模型接口，默认只监听本机。
web_app:
  entry: app.py
  port: 8508
  bind: 127.0.0.1
