# 候选池种子配置 + 抓取源开关
# code 统一用 akshare 习惯的"6位代码"，market 用于区分 A股/ETF 等，
# 便于 data_sources.py 选择正确的 akshare 接口前缀。

seeds:
  # 手动种子标的：即使抓取源当天没发现，也始终保留在候选池里跟踪
  - code: "600519"
    name: "贵州茅台"
    market: "sh"
    type: "stock"
  - code: "510300"
    name: "沪深300ETF"
    market: "sh"
    type: "etf"

sources:
  eastmoney_hot_rank: true      # 东方财富人气榜
  eastmoney_guba_hot: true      # 东方财富股吧热帖
  xueqiu_hot_stock: true        # 雪球热门股票
  iwencai_screener: true        # 问财自然语言选股（功能 3 复用）

candidate_pool:
  max_size: 100          # 候选池上限，超出按热度分数淘汰最低分
  score_decay_days: 7    # 超过 N 天未被任何抓取源再次提及，分数开始衰减

screener:
  # 功能 3 的默认查询集合，run_screener.py 不传参数时依次跑这些
  default_queries:
    - "今日涨停"
    - "连续三日放量上涨"
    - "探底回升"
    - "MACD金叉且成交量放大"

kline:
  days: 120          # 每次生成 K 线图取最近多少个交易日
  adjust: "qfq"       # 复权方式：qfq 前复权 / hfq 后复权 / "" 不复权

outcomes:
  lookback_days: 7          # 结果回溯：拿多少天前的候选池快照去核对后续涨跌
  notable_gain_pct: 15.0    # 涨跌幅绝对值超过这个百分比，记入改进积压账本供 review 参考

# 阶段3自算信号（见 next_doc/stock_watch_pool_state_tracking_and_kanban_
# plan.md 阶段3）：不依赖外部网站结论，自己分析历史行情/公告/新闻。
# 默认全部关闭，需要显式打开，避免候选池分数/理由的语义突然变化。
signals:
  price_enabled: false          # 历史行情技术指标（MA金叉死叉/放量突破/布林带突破）
  announcement_enabled: false   # 公告结构化分类（业绩预增/回购/减持等关键词分类）
  news_enabled: false           # 新闻舆情统计（关键词词频 + 新闻数量突增）
  scan_max_targets: 20          # run_signal_scan.py 每次最多分析多少只标的
  announcement_weights: {}       # 可覆盖 announcement_signals.py 里各分类的默认分值
    # 示例：earnings_beat: 8.0
