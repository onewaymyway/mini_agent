name: stock_watch

entrypoints:
  hotlist_scan:
    cmd: "python entrypoints/run_hotlist_scan.py"
    schedule: "cron: 30 8 * * 1-5"   # 盘前 08:30，交易日
    timeout_sec: 600
  kline_batch:
    cmd: "python entrypoints/run_kline_batch.py"
    schedule: "cron: 30 15 * * 1-5"  # 盘后 15:30，交易日
    timeout_sec: 900
  screener:
    cmd: "python entrypoints/run_screener.py"
    schedule: "cron: 0 9 * * 1-5"    # 开盘前 09:00，跑一遍默认条件集
    timeout_sec: 300
  stock_analysis:
    cmd: "python entrypoints/run_stock_analysis.py"
    # 无 schedule：按需触发（大管家 trigger_run 或手动传入标的代码），
    # 不适合无差别定时跑全市场个股分析
    timeout_sec: 600
    # entrypoint 需要传参数的声明（external_projects_kanban_integration_
    # plan.md 阶段6）：按此顺序拼成位置参数追加在 cmd 后面，与
    # run_stock_analysis.py 读 sys.argv[1]/sys.argv[2] 的既有写法对齐，
    # 看板「▶️ 手动触发」据此渲染输入框。
    params:
      - name: code
        required: true
        help: "股票代码，如 600519"
      - name: name
        required: false
        help: "股票名称（可选，缺省时用代码本身）"
  reconcile_outcomes:
    cmd: "python entrypoints/reconcile_outcomes.py"
    schedule: "cron: 0 18 * * 1"     # 每周一盘后，核对一周前候选池快照的实际表现
    timeout_sec: 600
  # 以下两个 entrypoint 见 next_doc/stock_watch_pool_state_tracking_and_
  # kanban_plan.md 阶段2：候选池状态机 + 按状态区间的涨跌跟踪。
  pool_tracking:
    cmd: "python entrypoints/run_pool_tracking.py"
    schedule: "cron: 45 15 * * 1-5"  # 盘后，晚于 kline_batch(15:30)，避免抢锁
    timeout_sec: 600
  change_pool_state:
    cmd: "python entrypoints/change_pool_state.py"
    # 无 schedule：按需触发（看板「变更状态」按钮或人工调用），不适合
    # 定时跑——状态变更应该是显式的人工判断动作。
    timeout_sec: 60
    params:
      - name: code
        required: true
        help: "标的代码"
      - name: state
        required: true
        help: "新状态：watching/focused/buy_suggested/holding/sell_suggested/dropped"
      - name: note
        required: false
        help: "变更原因（可选）"
  # 阶段3（自主挖掘信号，见同一文档阶段3）：不依赖外部网站结论，自己
  # 分析候选池内标的的历史行情/公告/新闻。默认关闭（见 config/
  # watchlist.yaml 的 signals.*_enabled），因此即使有 schedule 声明，
  # 三个信号开关全关时 main() 会立即跳过、不发起任何抓取。
  signal_scan:
    cmd: "python entrypoints/run_signal_scan.py"
    schedule: "cron: 0 19 * * 1-5"   # 盘后，晚于 pool_tracking(15:45)，避免抢锁
    timeout_sec: 900
  # tools/fetch_iwencai_cookie.py 的看板包装（见该 entrypoint 文件顶部
  # docstring）：交互式获取问财 hexin-v 登录令牌。无 schedule——需要人在
  # 有显示器的桌面环境手动完成登录/验证，不适合无人值守定时跑；运行
  # daemon 的机器如果是纯服务器（无 GUI），这个 entrypoint 会直接失败，
  # 见 PROJECT.md"已知限制"一节。
  #
  # 三个 params 全部给了 default（而不是只标 required: false）：
  # `manifest.py::build_cmd_with_params()` 对"没填值也没有 default"的
  # 可选参数的处理是——直接不追加这个位置参数，也不追加它后面的所有
  # 参数（因为这是位置参数语义，跳过中间一个会让后面的参数错位）。
  # 之前只留空 port、单独填 spawn 就会导致 spawn 连同 --spawn 一起被
  # 整体丢弃，看板等于"静默"退化成了非 spawn 模式——这是 2026-08-27
  # 使用者实测踩到的坑。给三个参数都配上 default 后，不管用户填了哪几个、
  # 留空了哪几个，都会用 default 补齐、按声明顺序完整拼出三个位置参数，
  # 不会再出现"填了却因为前面留空而被吞掉"的情况。
  fetch_iwencai_cookie:
    cmd: "python entrypoints/fetch_iwencai_cookie.py"
    timeout_sec: 180
    params:
      - name: port
        required: false
        default: "9222"
        help: "Chrome 调试端口，默认 9222"
      - name: spawn
        required: false
        default: "0"
        help: "1/true 表示自己拉起独立 Chrome 实例；0/false 表示假设已用调试端口手动启动 Chrome（默认）"
      - name: timeout
        required: false
        default: "120"
        help: "等待用户完成登录/验证的秒数，默认 120"

health_check:
  cmd: "python entrypoints/health.py"

resources:
  allowed_domains:
    - "eastmoney.com"
    - "guba.eastmoney.com"
    - "xueqiu.com"
    - "iwencai.com"
    - "10jqka.com.cn"
    - "sina.com.cn"
  max_concurrency: 1

# 持续优化迭代机制（见 next_doc/stock_watch_continuous_improvement_plan.md
# 阶段 4）：每周由 daemon 发起一次 review session，读账本/改进积压账本，
# 判断有没有值得处理的优化项。当前这一步的实际调度接线（接入运行中
# daemon 的 CronScheduler）还没做，`enabled: true` 只影响
# `mini-agent projects review stock_watch` 这条命令是否打印"未开启"的
# 提示，不会导致任何自动行为——见该文档阶段 4 的验收说明。
review:
  cadence: weekly
  enabled: true

# 通用看板视图声明（external_projects_generic_kanban_view_refactor_plan.md
# 阶段D）：取代阶段4手写在看板前端的 stock_watch 专属渲染。字段名直接对应
# `report.py::write_pool_tracking_json()` 已有的输出（
# `data/pool_tracking_latest.json`，记录数组包在 "entries" 键下）：
# code/name/state/current_price/score/reasons。不改动
# candidate_pool.py/run_pool_tracking.py 的业务逻辑本身。
dashboard:
  kanban_view:
    data_file: "data/pool_tracking_latest.json"
    id_field: "code"
    title_field: "name"
    state_field: "state"
    # 顺序与 candidate_pool.POOL_STATES 一致，按"关注程度递进"排列；
    # dropped 放最后且默认折叠，已淘汰的标的不是日常需要盯的对象。
    states:
      - value: "watching"
        label: "👀 观察池"
      - value: "focused"
        label: "🔎 重点关注"
      - value: "buy_suggested"
        label: "🟢 建议买入"
      - value: "holding"
        label: "📌 已建仓"
      - value: "sell_suggested"
        label: "🔴 建议卖出"
      - value: "dropped"
        label: "⚪ 已淘汰"
        collapsed: true
    metric_fields:
      - field: "current_price"
        label: "当前价"
        format: "number"
      - field: "score"
        label: "分数"
        format: "number"
    detail_list_field: "reasons"
    change_state:
      entrypoint: "change_pool_state"
      id_param: "code"
      state_param: "state"
      note_param: "note"
