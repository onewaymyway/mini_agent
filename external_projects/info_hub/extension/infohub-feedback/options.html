<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>info_hub 反馈 · 设置</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 24px; max-width: 520px; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; }
    button { margin-top: 12px; padding: 6px 14px; }
    #msg { margin-top: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>info_hub 反馈设置</h2>
  <p>推荐：在看板“抓取结果 → 服务管理”点击“配对插件”，插件会自动取得令牌，无需在此填写。下面的令牌仅用于手动配置或排错（令牌文件：data/state/receiver_token.txt）。</p>
  <label>接收服务端口</label>
  <input id="port" type="number" min="1" max="65535" value="18765">
  <label>连接令牌</label>
  <input id="token" type="password" autocomplete="off">
  <label style="display:flex;gap:8px;align-items:flex-start">
    <input id="showAll" type="checkbox" style="width:auto;margin-top:3px">
    <span>在专用浏览器的所有页面显示反馈工具条（默认关闭）。<br>
      非看板打开的页面会以“手动反馈”记录（信息源记为 manual），不统计停留时长。</span>
  </label>
  <button id="save">保存</button>
  <button id="test">测试连接</button>
  <div id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
