# Bangumi 每日放送（番组计划官方公开接口，免 key）：只取“今天”播出的条目，按评分从高到低。
# 接口：https://api.bgm.tv/calendar（周一为 1，周日为 7）。解析逻辑在同目录的 script.py。
id: bangumi_calendar
name: Bangumi 今日放送
category: video
kind: feed
adapter: script
enabled: true
schedule: {every: 6h}
request:
  url: https://api.bgm.tv/calendar
policy: {max_items: 60}
tags: [Bangumi, 动画, 放送]
