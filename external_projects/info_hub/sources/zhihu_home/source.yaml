id: zhihu_home
name: 知乎首页推荐
category: hot_community
kind: feed
adapter: html_list
enabled: true
schedule:
  every: 10m
request:
  url: https://www.zhihu.com/
browser:
  required: true
  site: zhihu
  headless: true
  wait_selector: .TopstoryItem
parse:
  list_selector: .TopstoryItem
  fields:
    title: .ContentItem-title
    url: h2 a@href
    summary: .RichContent-inner
policy:
  max_items: 40
tags:
- 知乎
- 推荐
- 首页
