# 网易新闻移动端首页（服务端渲染，直接抓取 HTML；只取文章链接，忽略频道导航）。
# 原 JSON 列表接口已停更（返回 2018 年缓存），改为抓首页。
id: netease_news
name: 网易新闻首页
category: news
kind: feed
adapter: html_list
enabled: true
schedule: {every: 30m}
request:
  url: https://c.m.163.com/
  headers: {User-Agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"}
parse:
  list_selector: 'a[href*="/news/a/"], a[href*="/news/v/"], a[href*="/news/s/"]'
  fields:
    title: self
    url: "@href"
    published_at: parent   # 来源与日期写在链接的父元素里，从中提取日期（可含时间）
policy: {max_items: 80}
tags: [网易, 新闻]
