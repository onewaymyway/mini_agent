# 信息源发现（第三阶段）：按兴趣画像，套用站内搜索模板生成候选信息源。
# 候选默认停用，需要在看板“候选收件箱”里点“加入信息源”确认后才会抓取。
#
# limits.daily：每天最多新生成的候选数；limits.pending：同时待确认的候选上限。
# templates：搜索模板。source 与普通信息源的 source.yaml 结构相同，但 request.url 必须
#           且只能包含一次 {query}（会被替换为 URL 编码后的查询词）。
#           请按目标站点的搜索页与页面结构填写 parse 等字段，并先用“信息源”页签的预览确认可用。
#
# 示例（默认不启用，需按实际站点改写）：
#
# templates:
#   - id: site_search
#     name: 某站搜索
#     source:
#       kind: feed
#       adapter: html_list
#       category: news
#       request:
#         url: https://example.com/search?q={query}
#       schedule:
#         every: 6h
#       parse:
#         list_selector: div.result
#         fields:
#           title: a.title
#           url: a.title@href
#       policy:
#         max_items: 20
#       tags: [搜索]

limits:
  daily: 3
  pending: 10

# 采纳率自动调节：已做出决定的候选达到 min_decisions 条且采纳率低于 min_rate 时，暂停该模板生成。
# 暂停原因会显示在“推荐效果评估”中；把 min_rate 设为 0 即可关闭自动暂停。
adoption:
  min_decisions: 5
  min_rate: 0.2

templates: []

# 自动探索（P12）：站点由系统自动探索，用户不需要配置站点。
# P19：本段与 review 段的参数可在看板修改；看板保存的值优先于此文件（见 docs/configuration.md）。
# daily：每天最多探索的站点数；min_interval_hours：同一站点两次探索的最小间隔；
# min_items：预览至少要有的条目数；min_completeness：预览条目中标题与链接都有的比例。
autoexplore:
  daily: 20
  min_interval_hours: 1
  min_items: 3
  min_completeness: 0.8
  harvest_limit: 30
  max_listing_pages: 4     # P14：每站点最多探索的栏目页（sitemap 栏目 + 站内分类）
  max_feeds_per_site: 3    # P14：每站点最多登记的订阅入口
  render: off              # P14：off | headed。headed 时，页面无列表结构则用有头浏览器（一次性 profile）渲染后再判断
  render_daily: 40         # P14：每天最多渲染次数
  background: false        # P17：后台自动探索（由 tick 调用），默认关闭；开启后仍可在看板随时暂停
  background_every_hours: 6  # P17：后台两次运行的最小间隔
  background_window: "00:00-24:00"  # P17：运行窗口，如 "22:00-06:00"（支持跨午夜）
  low_yield_checks: 5      # P17：探索达到该次数仍无产出，才视为低产出
  low_yield_threshold: 0.1 # P17：产出分低于该值视为低产出
  recheck_days: 30         # P17：低产出站点的复查间隔

# 复查与退役（P18）：对「自动探索发现、且已确认启用」的信息源做周期复查（小样本预览）。
# 默认关闭；开启后由 tick 每天最多运行一轮。失败时尝试同站替代入口（进候选收件箱，需确认）；
# 连续失败达到 retire_after 次只标记「建议退役」，auto_retire 开启后才自动停用。需要浏览器的源不复查。
review:
  enabled: false
  every_days: 30            # 正常源的复查间隔
  failing_recheck_days: 7   # 上次复查失败的源的复查间隔
  retire_after: 3           # 连续复查失败多少次后建议退役
  auto_retire: false        # 是否自动停用（默认只建议，不自动改动）
  max_alternatives: 3       # 每个失效源每次最多生成的替代候选
  daily: 10                 # 每轮最多复查的源数
  redraft: true             # 失效源是 html_list 且有可用模型时，让模型重建同页面草稿
