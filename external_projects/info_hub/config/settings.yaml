# 全局配置。所有路径相对于 info_hub 项目根目录。
paths:
  sources_dir: sources
  data_dir: data
  reports_dir: reports
  browser_profile_dir: browser/profile
streamlit:
  port: 8506
  background_tick: true   # 看板进程内是否后台调度
health:                   # 信息源健康：降频与自动暂停（默认关闭；失败计数与标红始终开启）
  enabled: false
  degrade_after: 3        # 连续失败 N 次：标红；开启 enabled 后同时降频
  pause_after: 8          # 连续失败 M 次：自动暂停（需 enabled），手动恢复前 tick 不再运行
  backoff_factor: 2       # 降频倍数：每多失败一次，间隔 × 该倍数
  max_interval: 1d        # 降频后的间隔上限
defaults:
  schedule_every: 60m
  retain_days: 14
  max_items: 50
  tick_interval_minutes: 5
reports:
  - id: rolling
    every: 3h
    window: 3h
    categories: all
  - id: daily
    at: "08:00"
    window: 24h
    categories: all
view:                     # 已弃用：看板只保留“在专用浏览器中打开”，不再读取此项（后端接口暂留，待确认后清理）
  default_open_mode: reader
profile:                  # 兴趣画像
  llm_enabled: true       # 是否允许用 LLM 归纳兴趣（需已配置模型；关闭后只用统计）
  rank_reports: true      # 报告中每个信息源的条目是否按兴趣排序（不影响抓取数据）
feed:                     # 推荐信息流（看板“推荐”标签页，P1）；全部可调，缺省值与 core/feed.py 的 DEFAULT_CONFIG 一致
  featured_size: 10       # 今日精选条数
  hot_min_sources: 3      # 多源热点：至少被几个不同信息源报道
  hot_size: 8             # 多源热点最多条数
  topic_groups: 4         # 关注主题分组数
  topic_group_size: 5     # 每个主题组最多条数
  topic_min_group: 2      # 主题组至少包含的簇数
  later_size: 30          # 稍后看队列展示条数
  others_limit: 30        # 其余分区默认展示条数
  candidate_limit: 2000   # 候选池上限
  cluster_threshold: 0.45 # 标题聚合阈值（越大越保守，宁可漏聚，不要误并）
  cold_start_factor: 0.3  # 画像为空时 interest 权重的系数
  persistence_snapshots: 12  # 一直挂在榜上超过该快照数的条目降权
  explore_ratio: 0.15     # 精选中探索位的比例（画像之外的内容）；0 即关闭
  explore_min_featured: 4 # 精选条数少于该值时不设探索位
  diversity:              # 精选的多样性控制
    source_cap: 3         # 同一信息源在精选中最多条数
    topic_repeat_penalty: 0.1  # 同一主题每多一条，后续候选扣分
  fatigue:                # 曝光疲劳：展示很多次却从未点击的条目逐步降权
    shows: 3              # 展示达到该次数开始计入
    window_days: 7        # 只统计最近这么多天的展示
  weights:
    interest: 0.35
    source_affinity: 0.15
    freshness: 0.25
    importance: 0.25
    persistence_penalty: 0.3
    fatigue_penalty: 0.2  # 设为 0 即关闭疲劳降权
  learning:               # P3 学习权重：默认关闭；训练后还需留出集验证通过，且在页面上开启，才会生效
    min_samples: 200      # 带标签的展示样本下限
    min_gain: 0.02        # 留出集 NDCG@10 至少高出手工权重这么多
    holdout_ratio: 0.3    # 留出集占比（按展示批次时间切分，取较晚的部分）
    days: 60              # 只用最近这么多天的展示
  llm:                    # P4 LLM 增强：默认关闭；页面上开启后，点“运行”才会调用模型
    enabled: false        # 配置层面的默认值（页面开关另行控制）
    daily_limit: 40       # 每日模型调用次数上限
    batch_size: 8         # 每次调用包含的条目数
    top_n: 12             # 摘要覆盖的前列卡片数
    pair_enabled: true    # 是否判断“近似报道是否为同一事件”
    pair_low: 0.25        # 近似对的 Jaccard 下限
    pair_max: 40          # 每次最多判断的近似对数
  half_life_hours:        # 新鲜度半衰期（小时），按信息源类型
    hot_list: 3
    feed: 12
    recommend: 24
    custom: 12
    subscription: 72
    default: 12
dedicated_browser:        # 专用浏览器：独立数据目录的有头浏览器，用于抓取与阅读（看板可管理）
  executable: ""          # 留空则自动查找 Chrome / Edge；可填绝对路径
  profile_dir: browser/dedicated_profile
  debug_port: 9223        # 调试端口（仅本机），抓取附着用；与接收服务端口不同
  scrape_mode: launch     # launch：Playwright 独立启动（旧方式）；cdp：附着到专用浏览器（看板可切换）
feedback_receiver:        # 反馈插件的本地接收服务（python -m server.feedback_receiver）；看板可修改
  port: 18765
