# 全局配置。所有路径相对于 info_hub 项目根目录。
paths:
  sources_dir: sources
  data_dir: data
  reports_dir: reports
  browser_profile_dir: browser/profile
streamlit:
  port: 8506
  background_tick: true   # 看板进程内是否后台调度
health:                   # 信息源健康：降频与自动暂停（默认关闭；失败计数与标红始终开启）
  enabled: false
  degrade_after: 3        # 连续失败 N 次：标红；开启 enabled 后同时降频
  pause_after: 8          # 连续失败 M 次：自动暂停（需 enabled），手动恢复前 tick 不再运行
  backoff_factor: 2       # 降频倍数：每多失败一次，间隔 × 该倍数
  max_interval: 1d        # 降频后的间隔上限
defaults:
  schedule_every: 60m
  retain_days: 14
  max_items: 50
  tick_interval_minutes: 5
reports:
  - id: rolling
    every: 3h
    window: 3h
    categories: all
  - id: daily
    at: "08:00"
    window: 24h
    categories: all
