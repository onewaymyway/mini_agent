# 需要登录的站点配置。信息源通过 browser.site 引用这里的 id。
# expired_pattern：访问后最终 URL 若包含该片段，视为登录已失效（例如被跳转到登录页）。
sites:
  example_site:
    name: 示例站点
    login_url: https://example.com/login
    check_url: https://example.com/me
    expired_pattern: /login
  zhihu:
    name: 知乎
    login_url: https://www.zhihu.com/signin
    check_url: https://www.zhihu.com/hot
    expired_pattern: /signin
  xiaohongshu:
    # 登录页与登录失效特征需以本机实际页面为准；若登录检测误判，请调整 expired_pattern 或 check_url
    name: 小红书
    login_url: https://www.xiaohongshu.com/explore
    check_url: https://www.xiaohongshu.com/explore
    expired_pattern: /login
  netease_money:
    # 网易财经无需登录；此处只为满足 browser.site 必填，expired_pattern 正常不会命中
    name: 网易财经
    login_url: https://money.163.com/
    check_url: https://money.163.com/
    expired_pattern: /passport/
