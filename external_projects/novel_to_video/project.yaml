# project.yaml — novel_to_video 与 daemon 之间的契约（字段规范见 src/mini_agent/external_projects/manifest.py）。
#
# 里程碑进度见 PROJECT.md。当前为 Phase 0：导入与项目创建。
# 本项目默认不登记任何 cron 调度；视频生成属于高成本操作，需要用户在界面确认后手动触发。

name: novel_to_video

entrypoints:
  import_novel:
    cmd: "python entrypoints/import_novel.py"
    timeout_sec: 600
  list_projects:
    cmd: "python entrypoints/list_projects.py"
    timeout_sec: 120

health_check:
  cmd: "python entrypoints/health.py"

resources:
  # 图像/视频/TTS 的外部调用在后续阶段加入，届时在此登记域名
  allowed_domains: []
  max_concurrency: 1

review:
  cadence: weekly
  enabled: false
