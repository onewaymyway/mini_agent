# project.yaml — novel_to_video 与 daemon 之间的契约（字段规范见 src/mini_agent/external_projects/manifest.py）。
#
# 里程碑进度见 PROJECT.md。当前为 Phase 1：导入、全书级素材（G-2/G-3）。
# 本项目默认不登记任何 cron 调度；图像/视频生成属于高成本操作，需要用户在界面确认后手动触发。

name: novel_to_video

entrypoints:
  import_novel:
    cmd: "python entrypoints/import_novel.py"
    timeout_sec: 600
  list_projects:
    cmd: "python entrypoints/list_projects.py"
    timeout_sec: 120
  build_assets:
    cmd: "python entrypoints/build_assets.py"
    timeout_sec: 3600

health_check:
  cmd: "python entrypoints/health.py"

resources:
  # Phase 1 起调用 Agnes 生图接口（apihub.agnes-ai.com），文本 LLM 由 mini_agent 宿主完成
  allowed_domains: ["apihub.agnes-ai.com"]
  max_concurrency: 1

review:
  cadence: weekly
  enabled: false
