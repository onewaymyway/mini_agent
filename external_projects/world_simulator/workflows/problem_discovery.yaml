name: problem_discovery
description: >-
  Problem Discovery Engine（第九轮批次三，`next_doc/world_simulator_
  problem_capability_gap_plan.md` 2.4 节）。由 `world_simulator/
  problem_discovery.py::suggest_problems()` 触发。用 `type: agent`
  （同 `experiment_design.yaml`/`retrospective.yaml`）——"当前哪些
  目标被什么挡住了"是通用推理能力，不依赖具体场景模板的私有规则，
  不需要按 template 绑定 skill。
  【重要】同 `experiment_design.yaml` 踩过的坑：`type: agent` 不支持
  `result_file`/`result_file_required_keys`，这里同样要求 Agent 直接
  把 JSON 作为最终回复的全部内容，由
  `world_simulator/agent_step_result.py` 从 `StepResult.output` 解析。
version: "1.0"
steps:
  - id: problem_discovery
    name: 扫描当前可观察到的问题和潜在问题
    type: agent
    prompt: |
      你正在为一次"世界模拟"扫描"当前有哪些问题"。下面是相关素材：

      当前状态数值（JSON 对象）：
      {current_vars_json}

      这次模拟声明的理想状态（JSON 对象，可能为空对象——为空表示
      没有声明结构化的理想状态，请只依据当前状态数值和下面的近期
      历史自行判断，不要因为它为空就不给出任何建议）：
      {desired_state_json}

      最近几步的历史（JSON 数组，每项包含 step/summary/narrative，
      按时间顺序）：
      {recent_history_json}

      请你完成两件事：
      1. `observed`：列出最多 {max_observed} 条**当前已经能观察到**
         的问题——从当前状态数值/近期历史里能直接看出"确实发生了、
         正在造成影响"的现实问题。
      2. `latent`：列出最多 {max_latent} 条**还没有爆发，但从现有
         结构可以推导出来**的潜在问题——现在看起来一切正常，但顺着
         当前的数值走势/近期历史推演下去，大概率会在未来某个时间点
         变成一个真正的问题。这一类问题的价值就在于"提前预警"，
         请认真区分它和 `observed` 的边界，不要把已经发生的问题也
         塞进这里。

      两组里的每一项格式相同（`root_causes`/`candidate_solutions`/
      `depends_on` 三个字段是可选的——判断不出来就给空数组，不要为了
      填满而编造）：`{{"symptom": "一句话，可观察到的症状是什么
      （`latent` 类可以写成"如果……持续下去，将会……"这样的推演句式）",
      "blocked_goal": "这个问题挡住了什么目标，一句话，如果上面的
      理想状态里声明了 conditions，可以参考但不要求精确对应，理想
      状态为空就凭对当前情境的理解给出", "missing_capabilities":
      ["字符串数组，1~3 条短语，达成目标还缺什么能力/资源/条件"],
      "root_causes": ["字符串数组，可选，1~3 条短语，这个问题的根因
      是什么——只有能从素材里有把握地判断出来时才给，判断不出来给
      空数组"], "candidate_solutions": ["字符串数组，可选，1~3 条
      短语，可能的解决方向提示——不是完整的行动方案设计，只是方向性
      提示，判断不出来给空数组"], "depends_on": ["字符串数组，可选，
      如果这条问题明显依赖近期历史/本次素材里提到的另一个问题先解决，
      用一句简短描述引用那个问题（不是 id，因为你还不知道对方的 id），
      多数情况下应该是空数组，只有依赖关系确实明显时才给"]}}`。

      **范围克制**：不需要穷举，只给你认为最值得用户注意的几条，
      两组都可以给空数组（`current_vars_json`/`recent_history_json`
      信息不足以支撑任何有把握的判断时，给空数组比编造更好）。这
      不是要你设计具体解决方案，只是"发现问题"这一步。

      【输出格式，必须严格遵守】你的最终回复必须**只包含一个 JSON
      对象**，不要有任何其它文字、解释、markdown 代码块围栏、或工具
      调用——直接把下面这两个字段组成的 JSON 对象作为你这一轮对话的
      最后回复内容，不要在 JSON 前后加说明文字：

      - `observed`：数组，格式见上文，最多 {max_observed} 项。
      - `latent`：数组，格式见上文，最多 {max_latent} 项。

      不要用 bash/echo 或任何工具来"打印"这个 JSON。你的最后一条回复
      消息，去掉首尾空白后，必须能被直接当 JSON 解析。
