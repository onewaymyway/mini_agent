name: decision_generate
description: >-
  4.12 节第三步（阶段三十三第八批，`next_doc/
  world_simulator_potential_causal_space_and_decision_engine_plan.md`）：
  在 `manifest.settings.split_decision_calls == True` 时，紧接
  `world_evolve.yaml` 之后由 `world_simulator/engine/advance.py::
  advance()` 调用——把 `world_evolve` 那次调用产出的"世界怎么变化了"
  （新状态摘要/叙事/变量/因果线与因果树更新）作为既成事实喂进来，
  **专门**判断"这一步是否形成了需要用户做决定的时刻、要给出什么样
  的候选选项"（对应参考文档的 `Decision Engine` 独立模块）。不产出
  `next_vars`/`narrative` 等世界状态字段——那些已经由 `world_evolve`
  决定，这一步不应该也没有必要重新生成或修改。由
  `world_simulator/engine/advance.py::advance()` 触发，同样会在触发前
  把 `decision_generate` 步骤的 `skill_name` 按 `template` 输入动态
  改写为 `<template>-template`，理由同 `advance_step.yaml`。
version: "1.0"
steps:
  - id: decision_generate
    name: 基于世界演化结果生成候选决策选项
    type: skill_agent
    skill_name: life-sim-template   # 运行时会被 engine.py 按 template 覆盖
    result_file: decision_generate_result.json
    result_file_required_keys:
      - options
    prompt: |
      【重要】这是"世界演化"与"决策生成"拆分成两次调用（4.12 节第三步，
      阶段三十三第八批）里的**第二次调用**：世界这一步已经怎么变化，
      已经由上一次调用（World Engine）决定完毕，下面原样喂给你作为
      既成事实——你**不需要、也不应该**重新生成或修改 `next_vars`/
      `narrative`/`time_label` 这些字段，你这次调用**只**负责判断
      "基于这个已经发生的变化，接下来是否需要用户做出决定、给出什么样
      的候选选项"，只输出 `options`（可以是空数组）以及下面列出的
      几个可选的、与"这一批选项"相关的字段。

      当前模拟标题：{title}
      这一步刚发生的变化（由上一次调用产出，既成事实，仅供你判断
      "接下来该不该出现决策点"时参考——不要在你的输出里重复这些
      字段）：
      - 新状态摘要：{evolved_summary}
      - 叙事文本：{evolved_narrative}
      - 新状态详细变量（JSON）：{evolved_vars_json}
      - 这一步结束时对应的模拟内时间点：{evolved_time_label}
      - 这一步实际使用的时间粒度：{evolved_time_granularity}
      - 这一步声明的关键驱动因素（JSON 数组，可能为空）：{evolved_key_drivers_json}
      - 这一步对因果线"未来因果树"的更新（JSON 数组，可能为空——
        `confirmed_branch`/`new_branches` 等，代表哪些潜在节点这一步
        变得更值得关注）：{evolved_tree_updates_json}

      因果线设置（阶段二十二，多尺度因果线——只作为背景参考，帮你
      判断"这条线是不是已经到了需要做决定的节点"，不需要在输出里
      重复因果线本身的状态）：{causal_lines_hint}
      认知偏差声明字段（4.3 节，State/Belief 分离，为空表示未声明，
      直接忽略）：{belief_fields_hint}

      候选分支选项的生成流程（数量绝不是一个要凑够的目标值，而是下面
      这套判断流程的结果）：
      1. 先判断这一步的剧情/状态变化是否走到了一个"需要主体做出选择"
         的分岔点——如果没有（局势明朗、只有一个自然而然的走向），
         直接给空数组 `options: []`，不要为了"看起来有内容"硬凑选项；
      2. 如果有决策点，但排查下来只存在一个真正值得列出的有效行动，
         就只给这一个，不需要凑第二个陪衬选项；
      3. 如果存在多个有实质区分度（不同方向/不同代价/不同风险）的
         行动，可以都列出来，但如果理论上能想到的行动很多、彼此之间
         差异很小，优先合并成"有意义的决策前沿"再输出，而不是罗列
         一堆大同小异的选项来凑数；
      4. 上面这套流程算出来的候选数量如果超过了下面"用户设置的候选
         方向数量"这个软上限，优先合并/精简差异最小的几项，而不是
         为了不超上限而随意砍掉某个仍有实质意义的方向，也不要为了
         凑够上限而强行拆出本不该拆开的选项。
      用户设置的候选方向数量（软上限，不是目标值）：{option_count_hint}

      候选选项必须是"现实世界里可以理解、可以执行"的具体行动、路线
      或决策（比如"换工作""转向推理模型路线""提高利率""进入新市场"），
      不能是抽象的内部指标调节（比如"提升职业竞争力 20%""增加收入
      15%""模型能力 +0.1"这种）——内部数值当然会因为选项被选中而
      变化，但呈现给用户、写进 `label`/`description` 的必须是行动
      语义，不是数值语义；具体的正反例、以及本模板场景下的专属例子，
      见你所属 skill 的规范。

      如果这一步的关键变化本身是主体无法直接干预的宏观/外部事件
      （行业震荡、宏观经济、竞争对手动作、自然灾害等），不要把这个
      宏观事件本身包装成一个候选选项——上一次调用已经在
      `narrative`/`next_vars` 里如实呈现了这个宏观变化，你需要做的是
      沿因果链继续往下想："这件事最终影响到主体自己能采取行动的地方
      是什么"，把候选选项落在这个更下游、主体真正能施加影响的位置
      （例如"全球经济衰退"不直接变成选项，但"调整职业风险""增加现金
      储备"可以）。

      当且仅当"不作为"是这一步的一个真实后果分支（不选择任何选项
      本身会带来一个和"选了某个选项"同样值得说明的后果，比如机会
      窗口关闭、风险累积）时，才在 `options` 里显式包含一项 `id` 以
      `continue_` 开头（比如 `continue_status_quo`）的"维持现状"选项，
      并在它的 `description` 里说明"维持现状会怎样"；这不是每一步都
      要有的机械项——没有决策点时仍然是空数组，有决策点但"不选也是
      正常默认走向、没有额外代价"时同样不需要这一项。

      候选分支选项里每一项除了 `id`/`label`/`description`，可以额外给
      出以下可选字段（阶段三十二，Action Space 结构化，格式同
      `generate_scenario`）：`risk_level`（`low`/`medium`/`high`）、
      `reversibility`（`reversible`/`hard_to_reverse`/`irreversible`）、
      `affected_lines`（预计牵动的因果线 id 数组）、`key_uncertainty`
      （一句话最大不确定性）。不确定就不填，不要瞎猜凑数。

      候选分支选项里每一项还可以额外给出两个可选字段（第五轮方案
      5.1 节，`next_doc/world_simulator_decision_engine_round2_gap_
      analysis_plan.md`）：`prerequisites`（字符串数组，选择这个
      方向前需要满足的前提条件，比如"手头有 3 个月生活费缓冲"，没有
      明显前提就不填或给空数组）、`consequences`（一个对象，包含 `short_term`/`long_term`
      两个可选 key，分别是短期/中长期后果各一句话；
      `description` 已经说清楚的话不需要重复，可以只填其中一个 key
      或整体不填）。不确定就不填，不要瞎猜凑数。

      候选分支选项里每一项还可以额外给出 `action_reason`（阶段三十三
      第二批，4.2 节，一句话说明"为什么这个具体行动现在值得列入候选"，
      区别于 `description` 说的"选了会怎样"——例如"职业转型机会正在
      形成"是这一批选项共同的背景（见下方 `decision_reason`），而
      "转向 AI 相关岗位"这个选项自己的 `action_reason` 应该是"利用
      已有能力降低转型成本"这种针对这一个方向的理由）。存在多个候选
      方向时应该都填；只有一个选项时也建议填一句，除非理由已经在
      `description` 里说得很清楚。

      如果这一步的 `options` 是因为某条因果线/某个明确的触发事件
      走到了需要做决定的时刻，可以在输出的顶层（不是某个选项内部）
      额外给一个可选字段 `decision_reason`：一句话说明"为什么现在
      需要做这个决定"（这是这一批选项共享的背景，不是某一个选项的
      理由——例如"职业转型机会正在形成"这种宏观背景说明）。只有一个
      选项、或分岔的原因已经足够简单直白时，可以不填这个字段；
      `options` 为空数组时这个字段也没有意义，不用输出。

      候选分支选项里每一项还可以额外给出紧急程度相关的两个可选字段
      （阶段三十三第二批，4.3 节，独立于上面的 `risk_level`——高风险
      不等于高紧急，比如"十年后可能被 AI 替代"可以是低紧急高风险，
      "明天合同到期"可以是高紧急中风险）：
      - `urgency`：`"low"`/`"medium"`/`"high"`/`"critical"` 之一。
        判断依据：距离关键节点的时间、延迟决定的成本、机会窗口是否
        正在关闭、这个选择的不可逆程度、是否还有补救机会。四档含义：
        `low`（不影响继续模拟）、`medium`（提醒用户但不打断）、
        `high`（应当尽快处理）、`critical`（情况紧迫到应该暂停模拟、
        等待用户介入——**声明这一档会使模拟自动暂停**，请谨慎使用，
        只在确实到了"不能再拖"的程度才用，不要为了制造紧张感而
        滥用）。
      - `time_window`：一句人类可读的时间窗口描述（比如"数周内"/
        "下个季度前"），配合 `urgency` 使用，不确定可以不填。
      不确定就不填，不要为了"看起来更完整"而给每个选项都编一个
      紧急程度。

      候选分支选项里每一项还可以额外给出 `action_type`（阶段三十三
      第六批，4.7 节）：`"single"`（单一原子行动，默认，不填也是
      这个值）/`"combo"`（一次性打包了多个动作的组合方案）/
      `"conditional"`（"先做 A，如果……再做 B"这类带条件的方案）之
      一。这个字段只是给展示层一个"这是多步/条件性方案"的结构化
      提示，**不需要、也不应该**把"组合了什么/条件是什么"拆成额外
      的结构化字段——直接写进这个选项的 `description` 自然语言里
      就行（比如"先花一段时间了解行业信息，如果确认转型信号明确，
      再启动跳槽准备"）。不确定就用默认的 `single`，不要为了"看起来
      更丰富"而把简单选项硬套成组合/条件类型。
