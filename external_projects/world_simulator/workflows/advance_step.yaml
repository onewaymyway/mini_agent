name: advance_step
description: >-
  单步推进：当前 state + 本次选择 → next_state + 叙事 + 候选分支
  （world_simulator_external_project_plan.md 2.3 节 / 第 6 节）。由
  `world_simulator/engine.py::advance()` 触发，同样会在触发前把
  `step` 步骤的 `skill_name` 按 `template` 输入动态改写为
  `<template>-template`，理由同 `generate_scenario.yaml`。

  阶段四（自动挡）会在 `decision_context` 输入里多喂一份"代理决策者
  画像"（`autopilot.principles`/`risk_preference` 等），同时把
  `chosen_option_json` 留空——这种情况下 skill 需要自己从
  `current_options_json` 里按画像选一个，并在输出里带上
  `chosen_option_id`/`chosen_reason`（`engine.py::advance()` 会读这两个
  字段落盘，见其 docstring）。`decision_context` 为空字符串就是手动挡
  场景，本 workflow 定义本身不需要为自动挡改变结构。
version: "1.0"
steps:
  - id: step
    name: 推进一步
    type: skill_agent
    skill_name: life-sim-template   # 运行时会被 engine.py 按 template 覆盖
    result_file: next_state.json
    result_file_required_keys:
      - next_summary
      - narrative
      - next_vars
      - options
    prompt: |
      当前模拟标题：{title}
      当前状态摘要：{current_summary}
      当前状态详细变量（JSON）：{current_vars_json}
      当前时间步：{current_step}
      当前状态对应的模拟内时间点（人类可读描述，可能为空字符串——为空
      表示之前没有记录过，不代表"没经过时间"）：{current_time_label}
      产生*当前状态*这一步实际用的时间粒度（人类可读描述，比如
      "1 个月"/"1 年"/"一轮谈判"——这是"上一步跨越了多长/什么性质的
      时间"，与上面的"时间点"不是一回事）：{current_time_granularity}
      当前状态的候选分支选项（JSON 数组，可能为空）：{current_options_json}

      本步用户/代理选择的选项：{chosen_option_json}
      （如果为空对象 {{}}，按以下规则处理：
       - 如果下面的"代理决策者画像"非空：说明这是自动挡场景，请你从
         上面"候选分支选项"里挑一个最符合该画像的选项，在输出 JSON 里
         加上 `chosen_option_id`（选中选项的 id）和 `chosen_reason`
         （一两句话说明为什么这么选），再据此推进；如果候选分支选项本身
         为空数组，则没有可选项，正常给出默认走向即可，不需要这两个
         字段。
         如果"代理决策者画像"里明确写了"允许你跳出候选列表提出自定义
         选项"，且你确信候选列表里没有一个足够合理（不是"矮子里拔将军"
         就能接受的程度），可以改为输出 `custom_option_label`（新选项
         标题）、`custom_option_description`（新选项说明）和
         `chosen_reason`（说明候选列表为什么不够好、为什么提出这个新
         方向），不要同时输出 `chosen_option_id`——这个权限要谨慎使用，
         画像里没有明确允许时，必须从候选列表里选，不能自己发明选项。
       - 如果"代理决策者画像"为空：说明是普通的手动挡场景且未指定选择，
         请你依据当前状态给出最合理的默认走向，不要等待用户输入，也
         不需要输出 `chosen_option_id`/`chosen_reason`。
       如果"本步用户/代理选择的选项"非空对象，但它的 `id` 是
       `custom_` 开头：说明这是用户自己新增的、不在原候选列表里的选项
       （系统给的候选终究只是建议，用户/代理都可能想到更合理的方向），
       按这个选项的 `label`/`description` 正常推进即可，不需要额外
       处理，也不需要在输出里回填 `chosen_option_id`/`chosen_reason`
       （调用方已经知道选的是什么）。）

      代理决策者画像（自动挡时非空，手动挡时为空）：
      {decision_context}

      用户设置的时间粒度模式（决定这一步该用多长/什么性质的时间粒度，
      以及能不能中途切换）：{time_granularity_hint}
      多主体模式设置：{multi_entity_mode_hint}
      背景角色设置：{background_entities_hint}
      因果线设置（阶段二十二，多尺度因果线）：{causal_lines_hint}
      跨因果线级联提示（阶段三十三第三批，4.13 节，基于历史 causal_
      links 统计出的"线到线"连带影响，仅供参考、不代表这一步一定会
      发生；为空说明暂无足够历史数据或没有声明因果线）：
      {causal_graph_hint}
      主体关系设置（阶段三十六第二批，Influence Field / Relationship
      完整机制，为空说明没有声明任何关系）：{relationship_hint}
      理想状态设置（第九轮批次一，Desired State 结构化，未声明则说明
      没有结构化的理想状态描述，不影响推进）：{desired_state_hint}
      用户已确认关注的潜在问题（第九轮批次三，Problem Discovery
      Engine，来自 `problem_discovery.yaml` 的建议，用户点击"确认
      关注"后会出现在这里；为空说明没有任何已确认的建议，忽略这一项
      即可）：
      {confirmed_problem_suggestions_hint}
      用户提供的真实世界参考信息（阶段十八，Reality Sync 轻量版，
      仅供参考、不要照抄成精确数值，为空说明没有需要参考的真实
      数据）：{calibration_notes}
      系统从以往其它模拟中沉淀的相关已知因果知识（阶段二十，仅供
      参考，不要照抄，也不代表一定适用于这次模拟——它们是过去某些
      模拟里出现过的因果模式，置信度信息已在每一条后面标注）：
      {relevant_knowledge_hint}
      此前已被用户正式确认、应当视为既有事实的结构性变化（阶段
      二十三，可能为空——为空表示还没有任何已确认项，不代表模拟里
      不存在新结构，只是尚未被采纳）：
      {confirmed_structural_changes_hint}
      这次模拟迄今为止累计获得的能力（第十一轮 2.4 节，为空说明
      还没有任何结构化能力记录；候选分支选项应该体现这些已获得
      能力带来的新可能性，而不是忽略它们，但不强求每一步都用上）：
      {capabilities_hint}

      请按你所属 skill 的规范，给出这一步推进后的新状态、发生了什么的
      叙事文本、这一步结束时对应的模拟内时间点（`time_label`，人类
      可读的一句话，比如"3 个月后"/"第 2 年"，在"当前状态对应的模拟内
      时间点"基础上按这一步实际用的粒度往前推算，合理估算即可不用
      精确）、这一步实际使用的时间粒度（`next_time_granularity`，人类
      可读的一句话，比如"1 个月"/"1 年"/"一轮谈判"；按上面"时间粒度
      模式"的规则决定是延续上一步还是切换，切换时额外给
      `granularity_reason` 说明为什么），以及供下一步选择的候选分支
      选项。除了这次选择本身的直接后果之外，也别忘了大环境（经济周期、
      行业/技术发展、政策、社会观念等）是自己在演化的，不是只有主角/
      群体的选择在推动剧情——具体规则见你所属 skill 里"大环境是活的"
      那一条。

      候选分支选项的生成流程（数量绝不是一个要凑够的目标值，而是下面
      这套判断流程的结果）：
      1. 先判断这一步的剧情/状态变化是否走到了一个"需要主体做出选择"
         的分岔点——如果没有（局势明朗、只有一个自然而然的走向），
         直接给空数组 `options: []`，不要为了"看起来有内容"硬凑选项；
      2. 如果有决策点，但排查下来只存在一个真正值得列出的有效行动，
         就只给这一个，不需要凑第二个陪衬选项；
      3. 如果存在多个有实质区分度（不同方向/不同代价/不同风险）的
         行动，可以都列出来，但如果理论上能想到的行动很多、彼此之间
         差异很小，优先合并成"有意义的决策前沿"再输出，而不是罗列
         一堆大同小异的选项来凑数；
      4. 上面这套流程算出来的候选数量如果超过了下面"用户设置的候选
         方向数量"这个软上限，优先合并/精简差异最小的几项，而不是
         为了不超上限而随意砍掉某个仍有实质意义的方向，也不要为了
         凑够上限而强行拆出本不该拆开的选项。
      用户设置的候选方向数量（软上限，不是目标值）：{option_count_hint}

      候选选项必须是"现实世界里可以理解、可以执行"的具体行动、路线
      或决策（比如"换工作""转向推理模型路线""提高利率""进入新市场"），
      不能是抽象的内部指标调节（比如"提升职业竞争力 20%""增加收入
      15%""模型能力 +0.1"这种）——内部数值当然会因为选项被选中而
      变化，但呈现给用户、写进 `label`/`description` 的必须是行动
      语义，不是数值语义；具体的正反例、以及本模板场景下的专属例子，
      见你所属 skill 的规范。

      如果这一步的关键变化本身是主体无法直接干预的宏观/外部事件
      （行业震荡、宏观经济、竞争对手动作、自然灾害等），不要把这个
      宏观事件本身包装成一个候选选项——先在 `narrative`/`next_vars`
      里如实呈现这个宏观变化，然后沿因果链继续往下想："这件事最终
      影响到主体自己能采取行动的地方是什么"，把候选选项落在这个更
      下游、主体真正能施加影响的位置（例如"全球经济衰退"不直接变成
      选项，但"调整职业风险""增加现金储备"可以）。

      当且仅当"不作为"是这一步的一个真实后果分支（不选择任何选项
      本身会带来一个和"选了某个选项"同样值得说明的后果，比如机会
      窗口关闭、风险累积）时，才在 `options` 里显式包含一项 `id` 以
      `continue_` 开头（比如 `continue_status_quo`）的"维持现状"选项，
      并在它的 `description` 里说明"维持现状会怎样"；这不是每一步都
      要有的机械项——没有决策点时仍然是空数组，有决策点但"不选也是
      正常默认走向、没有额外代价"时同样不需要这一项。

      如果这一步 `next_vars` 里有明显属于"你自己主观估计出来、置信度
      不高"的字段（比如某个成功率/概率类数值），可以在输出里额外给一个
      可选字段 `uncertain_fields`（数组，格式同 `generate_scenario`：
      `{"field": "字段名", "confidence": "high"|"medium"|"low", "note":
      "一句话说明"}`），没有需要标注的字段就不用输出。

      候选分支选项里每一项除了 `id`/`label`/`description`，可以额外给
      出以下可选字段（阶段三十二，Action Space 结构化，格式同
      `generate_scenario`）：`risk_level`（`low`/`medium`/`high`）、
      `reversibility`（`reversible`/`hard_to_reverse`/`irreversible`）、
      `affected_lines`（预计牵动的因果线 id 数组）、`key_uncertainty`
      （一句话最大不确定性）。不确定就不填，不要瞎猜凑数。

      候选分支选项里每一项还可以额外给出两个可选字段（第五轮方案
      5.1 节，`next_doc/world_simulator_decision_engine_round2_gap_
      analysis_plan.md`）：`prerequisites`（字符串数组，选择这个
      方向前需要满足的前提条件，比如"手头有 3 个月生活费缓冲"，没有
      明显前提就不填或给空数组）、`consequences`（一个对象，包含 `short_term`/`long_term`
      两个可选 key，分别是短期/中长期后果各一句话；
      `description` 已经说清楚的话不需要重复，可以只填其中一个 key
      或整体不填）。不确定就不填，不要瞎猜凑数。

      候选分支选项里每一项还可以额外给出 `action_reason`（阶段三十三
      第二批，4.2 节，一句话说明"为什么这个具体行动现在值得列入候选"，
      区别于 `description` 说的"选了会怎样"——例如"职业转型机会正在
      形成"是这一批选项共同的背景（见下方 `decision_reason`），而
      "转向 AI 相关岗位"这个选项自己的 `action_reason` 应该是"利用
      已有能力降低转型成本"这种针对这一个方向的理由）。存在多个候选
      方向时应该都填；只有一个选项时也建议填一句，除非理由已经在
      `description` 里说得很清楚。

      如果这一步的 `options` 是因为某条因果线/某个明确的触发事件
      走到了需要做决定的时刻，可以在输出的顶层（不是某个选项内部）
      额外给一个可选字段 `decision_reason`：一句话说明"为什么现在
      需要做这个决定"（这是这一批选项共享的背景，不是某一个选项的
      理由——例如"职业转型机会正在形成"这种宏观背景说明）。只有一个
      选项、或分岔的原因已经足够简单直白时，可以不填这个字段；
      `options` 为空数组时这个字段也没有意义，不用输出。

      候选分支选项里每一项还可以额外给出紧急程度相关的两个可选字段
      （阶段三十三第二批，4.3 节，独立于上面的 `risk_level`——高风险
      不等于高紧急，比如"十年后可能被 AI 替代"可以是低紧急高风险，
      "明天合同到期"可以是高紧急中风险）：
      - `urgency`：`"low"`/`"medium"`/`"high"`/`"critical"` 之一。
        判断依据：距离关键节点的时间、延迟决定的成本、机会窗口是否
        正在关闭、这个选择的不可逆程度、是否还有补救机会。四档含义：
        `low`（不影响继续模拟）、`medium`（提醒用户但不打断）、
        `high`（应当尽快处理）、`critical`（情况紧迫到应该暂停模拟、
        等待用户介入——**声明这一档会使模拟自动暂停**，请谨慎使用，
        只在确实到了"不能再拖"的程度才用，不要为了制造紧张感而
        滥用）。
      - `time_window`：一句人类可读的时间窗口描述（比如"数周内"/
        "下个季度前"），配合 `urgency` 使用，不确定可以不填。
      不确定就不填，不要为了"看起来更完整"而给每个选项都编一个
      紧急程度。

      候选分支选项里每一项还可以额外给出 `action_type`（阶段三十三
      第六批，4.7 节）：`"single"`（单一原子行动，默认，不填也是
      这个值）/`"combo"`（一次性打包了多个动作的组合方案）/
      `"conditional"`（"先做 A，如果……再做 B"这类带条件的方案）之
      一。这个字段只是给展示层一个"这是多步/条件性方案"的结构化
      提示，**不需要、也不应该**把"组合了什么/条件是什么"拆成额外
      的结构化字段——直接写进这个选项的 `description` 自然语言里
      就行（比如"先花一段时间了解行业信息，如果确认转型信号明确，
      再启动跳槽准备"）。选中一个 `combo`/`conditional` 选项之后，
      这一步仍然只推进一次，不会自动帮你跨越多步执行——如果这个
      选项被选中，下一次 `advance_step` 调用时请你自己根据
      `narrative` 里记录的"用户选择了先做 A 观察情况"这个既成事实，
      判断条件是否已经满足、要不要触发后续动作，引擎不会做任何
      特殊记账或提醒。不确定就用默认的 `single`，不要为了"看起来
      更丰富"而把简单选项硬套成组合/条件类型。

      认知偏差声明字段（4.3 节，State/Belief 分离）：{belief_fields_hint}
      （这一行为空表示这次模拟没有声明任何认知偏差字段，直接忽略下面
      这段说明）。如果非空，说明这次模拟声明了以上字段属于"角色认知
      可能与真实值不同"。`next_vars` 里这些字段请继续填写真实值
      （引擎按真实值推进后续情节，不受角色认知偏差影响）。如果这一步
      角色对其中某个字段的认知发生了变化（比如"意识到市场并没有那么
      火爆"），额外输出一个可选字段 `beliefs`：一个对象，key 是发生
      认知变化的字段名，value 是角色现在认为的估计值（可以是单一
      数字，也可以是包含 low/high/point 三个键的区间估计对象，这种
      区间估计，取决于这一步角色的认知有多确定）。认知没有变化的
      字段不要输出——不要为了填满这个字段而编造没有依据的"认知更新"。
      `narrative` 里如果提到角色的认知和真实情况有出入，应该让这种
      "认知-真实"的落差自然体现在情节里，而不是生硬地报数字。

      如果这一步的变化有明显的关键驱动因素（比如"市场需求超预期"
      "现金储备见底被迫收缩"），可以在输出里额外给一个可选字段
      `key_drivers`：一个字符串数组，1~3 条短语，帮用户不用逐字读
      `narrative` 就能抓住这一步的关键信息；这一步变化平淡、没有特别
      值得划重点的驱动因素就不用输出这个字段或给空数组，不要为了填
      满 3 条而凑数。

      如果想在 `key_drivers` 的基础上说明"具体影响了哪些字段、造成了
      什么后果"，可以再额外给一个可选字段 `causal_links`：一个数组，
      每项 `{"driver": "现金储备见底", "affected_fields": ["cash",
      "stage"], "effect": "被迫从「自由职业」转为「求稳定工作」"}`——
      `driver` 通常对应 `key_drivers` 里的某一条短语，`affected_fields`
      是这次变化受影响的字段名列表，`effect` 是一句话说明具体后果。
      这是给"想深入看一步"的用户的进阶信息，可以只输出 `key_drivers`
      而不输出 `causal_links`，也不要求两者一一对应，不需要每一步都给。

      如果这条因果关系归属到了某条因果线（见下方 `line_id`），可以
      再额外给两个可选字段说明这是\"哪种关系\"：`relation_type`
      （`"one_way"` 单向 / `"two_way"` 双向 / `"indirect"` 间接（通过
      别的线传导，不是直接作用）/ `"feedback_loop"` 反馈循环，四选一，
      不给按单向处理）和 `source_line_id`（这个影响是从哪条线发起的，
      和 `line_id` 表示的"影响落到哪条线"配合，才能说清"从 A 线影响
      到 B 线"；不给表示这是同一条线内部的因果关系，或者发起线不
      明确）。这两个字段不需要每条都给，只在能明确判断时给出。

      如果能判断出这条因果关系"隔多久生效、影响幅度多大"，可以再
      额外给两个可选字段：`delay_steps`（整数，这条关系从起因到
      生效隔了几步，比如 `2` 表示两步之后才体现）和 `magnitude`
      （自由文本定性描述，比如\"轻微\"/\"明显\"/\"剧烈\"，不需要精确
      量化）。判断不出来就都留空，不要为了填字段而编造数字。

      如果上面"主体关系设置"非空，且这一步的情节里某条声明了延迟
      （`delay_steps > 0`）的关系的"源头"确实发生了，可以额外给一个
      可选字段 `triggered_relationships`：字符串数组，见"主体关系
      设置"那段说明里给出的具体格式要求。没有关系被触发就不用输出
      这个字段。

      如果这一步里出现了原模型没有预期的、看起来会稳定存在下去的新
      结构（比如冒出一个原来没设定过的新实体、形成了一种新的运作
      机制、或者整个世界的运行规则发生了整体性切换），可以额外给一个
      可选字段 `structural_change`：`{"kind": "new_entity" |
      "new_mechanism" | "regime_shift", "description": "一句话描述这个
      新结构是什么", "proposed_fields": "自由 JSON，怎么组织由你判断"}`
      ——`kind` 三选一：
      `new_entity`（新实体/新角色出现）、`new_mechanism`（新的运作
      机制/规则出现，但世界整体运行逻辑没变）、`regime_shift`（世界
      整体运行规则发生切换，比如原来的假设不再成立）；`description`
      是给用户看的一句话说明；`proposed_fields` 是你建议固化下来的
      具体内容（自由 JSON，怎么组织由你判断，只要能让用户看懂这个新
      结构大致是什么样子）。**这个字段不会被系统自动采纳**——只会
      作为提示展示给用户，由用户自己决定要不要正式确认，所以判断要
      谨慎：只有你确信这个新结构不是一次性的、后续大概率还会持续
      存在或反复出现时才输出，绝大多数步骤不应该有这个字段，不要为了
      "显得有内容"而每步都报告。

      如果这一步的发展暴露了一个明确的现实问题（有具体症状、挡住了
      某个目标）、解决了之前存在的问题、或者让之前的问题演变成了另一
      个问题，可以额外给一个可选字段 `problems`：一个数组，每项
      `{"id": "problem_1", "symptom": "资金不足，无法招聘核心工程师",
      "blocked_goal": "在 12 个月内完成产品原型", "missing_
      capabilities": ["种子轮融资", "早期客户验证"], "status":
      "emerging"}`——
      - `id`：这个问题的标识，如果是之前某一步已经出现过、这一步只是
        状态发生变化（比如从 `emerging` 变成 `active`，或者被解决），
        请复用同一个 `id`；确实是全新的问题才用新 `id`。如果上面
        "用户已确认关注的潜在问题"里有相关的一条，可以直接把它变成
        一个正式的 `problems` 条目（`symptom`/`blocked_goal` 可以
        沿用建议里的文字），但这不是强制的——如果你判断这一步的剧情
        走向已经让某条建议过时/不再适用，可以不采纳它，不需要为了
        "响应"而勉强写入。
      - `symptom`：一句话，可观察到的症状是什么。
      - `blocked_goal`：一句话，这个问题挡住了什么目标（如果上面
        "理想状态设置"里声明了 `conditions`，可以参考但不要求精确
        对应）。
      - `missing_capabilities`：字符串数组，1~3 条，达成目标还缺什么
        能力/资源/条件——这是描述"缺什么"，不是要你设计具体解决方案。
      - `status`：`"emerging"`（刚显现）/`"active"`（明确存在、正被
        应对）/`"solved"`（已解决）/`"transformed"`（演变成了另一个
        问题）四选一。
      这一步没有值得记录的问题变化就不用输出这个字段或给空数组，不要
      为了"显得有内容"而每步都编造问题——多数平淡的推进步骤不需要
      这个字段。

      如果这一步的发展让角色/群体/组织真正获得了一项新的能力（不是
      单纯"变得更好一点"，而是"之前做不到的事，现在能做了"），可以
      额外给一个可选字段 `capabilities_gained`：一个数组，每项
      `{"capability": "能够自动分析潜在客户的付费意愿", "enables":
      ["更精准的销售话术", "更快的产品迭代"], "limitations":
      ["无法替代真实用户访谈"]}`——
      - `capability`：一句话，这一步新获得/形成的能力是什么。
      - `enables`：字符串数组，1~3 条，这个能力让哪些事情变得可能/
        更容易（说明性文字，不代表引擎会据此自动扩展候选选项）。
      - `limitations`：字符串数组，1~3 条，这个能力目前的局限是
        什么，避免让用户误以为这个能力无所不能。
      如果能判断出这项能力目前处于哪个阶段，可以再给一个可选字段
      `maturity_stage`，六选一：`"lab"`（实验室可行）/`"expert"`
      （专家可用）/`"developer"`（开发者可用）/`"consumer"`（普通
      用户可用）/`"cheap_at_scale"`（成本足够低、可大规模应用）/
      `"infrastructure"`（基础设施化/社会常态化）。判断不出来就
      留空，不要为了填字段而强行归类。
      还可以再给三个可选字段（第十二轮方案第 3 节，合并处理 Reality
      Renderer 五层输出框架 + First Possible Event）：
      - `first_occurrence`：布尔值，只有当你能判断"这是这次模拟历史
        上第一次达成这个能力"时才标注 `true`，不确定就不填（不要
        默认填 `false`，缺省就是没有判断）。
      - `behavior_change`：一句话，这个能力具体改变了什么行为模式
        （比如"团队不再需要人工审核每一笔订单"）。
      - `structural_impact`：一句话，如果已经观察到组织/产业结构
        层面的变化，写在这里（比如"催生了一个新的专职岗位"）；还没
        观察到就不填，不要提前预测。
      这三个字段同样是"不确定就不填，不要为了凑内容而每步都编造"——
      多数新增能力不需要填全这三个字段。
      还可以再给一个可选字段 `capability_kind`（第十二轮方案第 4
      节），三选一，判断这项能力更接近哪种类型：`"technology"`
      （技术类，如新工具/新方法/新算法）/`"organization"`（组织类，
      如新的分工方式/新岗位/新的协作流程）/`"institution"`（制度类，
      如新规则/新合同形式/新市场机制/新的激励安排）。举例：新的
      绩效考核制度是 `"institution"`，新的跨部门协作流程是
      `"organization"`，新的生产工具是 `"technology"`。判断不出来
      就不填，不填会按 `"technology"` 展示，不要为了填字段而强行
      归类。
      这一步没有真正新增能力就不用输出这个字段或给空数组，不要为了
      "显得有内容"而把普通的数值变化包装成"新能力"——多数平淡的
      推进步骤不需要这个字段。
