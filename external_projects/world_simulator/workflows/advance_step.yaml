name: advance_step
description: >-
  单步推进：当前 state + 本次选择 → next_state + 叙事 + 候选分支
  （world_simulator_external_project_plan.md 2.3 节 / 第 6 节）。由
  `world_simulator/engine.py::advance()` 触发，同样会在触发前把
  `step` 步骤的 `skill_name` 按 `template` 输入动态改写为
  `<template>-template`，理由同 `generate_scenario.yaml`。

  阶段四（自动挡）会在 `decision_context` 输入里多喂一份"代理决策者
  画像"（`autopilot.principles`/`risk_preference` 等），同时把
  `chosen_option_json` 留空——这种情况下 skill 需要自己从
  `current_options_json` 里按画像选一个，并在输出里带上
  `chosen_option_id`/`chosen_reason`（`engine.py::advance()` 会读这两个
  字段落盘，见其 docstring）。`decision_context` 为空字符串就是手动挡
  场景，本 workflow 定义本身不需要为自动挡改变结构。
version: "1.0"
steps:
  - id: step
    name: 推进一步
    type: skill_agent
    skill_name: life-sim-template   # 运行时会被 engine.py 按 template 覆盖
    result_file: next_state.json
    result_file_required_keys:
      - next_summary
      - narrative
      - next_vars
      - options
    prompt: |
      当前模拟标题：{title}
      当前状态摘要：{current_summary}
      当前状态详细变量（JSON）：{current_vars_json}
      当前时间步：{current_step}
      当前状态对应的模拟内时间点（人类可读描述，可能为空字符串——为空
      表示之前没有记录过，不代表"没经过时间"）：{current_time_label}
      当前状态的候选分支选项（JSON 数组，可能为空）：{current_options_json}

      本步用户/代理选择的选项：{chosen_option_json}
      （如果为空对象 {{}}，按以下规则处理：
       - 如果下面的"代理决策者画像"非空：说明这是自动挡场景，请你从
         上面"候选分支选项"里挑一个最符合该画像的选项，在输出 JSON 里
         加上 `chosen_option_id`（选中选项的 id）和 `chosen_reason`
         （一两句话说明为什么这么选），再据此推进；如果候选分支选项本身
         为空数组，则没有可选项，正常给出默认走向即可，不需要这两个
         字段。
       - 如果"代理决策者画像"为空：说明是普通的手动挡场景且未指定选择，
         请你依据当前状态给出最合理的默认走向，不要等待用户输入，也
         不需要输出 `chosen_option_id`/`chosen_reason`。）

      代理决策者画像（自动挡时非空，手动挡时为空）：
      {decision_context}

      用户设置的候选方向数量：{option_count_hint}
      用户设置的时间粒度（这一步大致代表多长的模拟内时间，据此换算
      变量变化幅度，不要默认按"一步=一年"）：{time_granularity_hint}

      请按你所属 skill 的规范，给出这一步推进后的新状态、发生了什么的
      叙事文本、这一步结束时对应的模拟内时间点（`time_label`，人类
      可读的一句话，比如"3 个月后"/"第 2 年"，在"当前状态对应的模拟内
      时间点"基础上按"时间粒度"往前推算，合理估算即可不用精确），以及
      供下一步选择的候选分支选项（数量按上面的设置，若情节明显没有
      分支可以给空数组）。除了这次选择本身的直接后果之外，也别忘了
      大环境（经济周期、行业/技术发展、政策、社会观念等）是自己在
      演化的，不是只有主角/群体的选择在推动剧情——具体规则见你所属
      skill 里"大环境是活的"那一条。
