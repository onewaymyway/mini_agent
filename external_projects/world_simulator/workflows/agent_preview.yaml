name: agent_preview
description: >-
  Agent Preview（阶段三十二后续，4.5 节第二批，见 `next_doc/
  world_simulator_agent_preview_and_adaptive_policy_plan.md`）。由
  `world_simulator/agent_preview.py` 触发，对一个自动挡画像在一个
  内置测试情境下单独跑一次选择，不写入任何正式模拟数据。用
  `type: agent`（同 `retrospective.yaml`），不挂载具体模板 skill——
  测试情境与场景模板无关。
  【重要】`type: agent` 不支持 `result_file`/`result_file_required_keys`
  "结果文件契约"（这套机制只在 `type: script`/`type: skill_agent` 里
  实现，见 `mini_agent/workflow/executors.py`）——之前这里误声明过
  `result_file`，导致该字段对 `type: agent` 完全不生效、
  `StepResult.result_file` 永远是 None，`agent_preview.py` 按这个字段
  判空必现失败。现在改为要求 Agent 直接把 JSON 作为最终回复的全部
  内容，由 `world_simulator/agent_step_result.py` 从
  `StepResult.output` 里解析，不依赖 result_file。
version: "1.0"
steps:
  - id: agent_preview
    name: 在测试情境下运行画像做一次选择
    type: agent
    prompt: |
      {decision_context}

      现在请你在下面这个测试情境里，按上面的画像做一次选择（这是一次
      独立的能力测试，不是正式模拟的一部分，选择不会产生任何实际
      后果）：

      情境：{scenario_title}
      {scenario_description}

      候选选项（JSON 数组，每项包含 id/label/description/risk_level/
      reversibility）：
      {scenario_options_json}

      【输出格式，必须严格遵守】你的最终回复必须**只包含一个 JSON
      对象**，不要有任何其它文字、解释、markdown 代码块围栏、或工具
      调用——直接把下面这个 JSON 对象作为你这一轮对话的最后回复内容：

      {{
        "chosen_option_id": "你选择的选项 id，必须是上面候选选项之一",
        "reason": "一到两句话说明为什么选这个，语气就是这个画像会有的语气",
        "referenced_policy": "如果这次选择明显是依据画像声明的某条 principles 或 conditional_policies 做出的，用一句话说明是哪一条、怎么用上的；如果这次选择更多是综合判断、说不出明确依据某条已声明的原则，就如实填写“综合判断，没有明确依据某条已声明的原则”，不要为了显得“有依据”而牵强附会（可选字段，没有可以留空字符串）"
      }}

      不要用 bash/echo 或任何工具来"打印"这个 JSON，也不要在 JSON 前后
      加"选择结果：""决策逻辑："这类说明文字——你的最后一条回复消息，
      去掉首尾空白后，必须能被直接当 JSON 解析。
