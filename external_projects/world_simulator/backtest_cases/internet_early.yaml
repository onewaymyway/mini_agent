# 回测案例：互联网早期里程碑（第二十二轮 WP5 示例；2026-10-02 已核对年份）
#
# 【核对记录】2026-10-02 由 Claude 对照公开资料逐条核对了**年份**（不是人工专家审定）：
#   1969 ARPANET 首次跨机构连通 —— 首条消息 1969-10-29（UCLA→SRI），多份来源一致；
#   1983 TCP/IP 成为标准协议    —— 口径：ARPANET 1983-01-01 整体切换到 TCP/IP；
#        来源对"DoD 宣布标准"的年份说法不一（1980/1982/1983），本案例取切换年；
#   1986 NSFNET 骨干网建成      —— 1985 立项、1986 骨干网（56kbps）运行，取 1986；
#   1991 万维网公开可用         —— 1991-08 首个网站 info.cern.ch 对外公开（1993-04 才免费开放）；
#   1993 Mosaic 发布            —— 1993-01 首发（Unix 版），Windows/Mac 版同年稍后；
#   1995 Netscape 上市          —— 1995-08-09。
# 里程碑的 stage / requires 是**建模判断**，不是史实，未做核对。
# 年份取整；同一事件常有多个"日期"口径（首次演示/标准发布/商用/上市），换口径会改变打分。
#
# 【模拟跨度】steps × years_per_step 必须覆盖最后一条真值，否则范围外的里程碑
# 不计入召回。原草稿 8 步×2 年 = 16 年（到 1985），只覆盖 1969/1983 两条；
# 已改为 13 步×2 年 = 26 年（到 1995）。步数变多，单次回测的 LLM 调用也变多。
#
# 别名化与年份平移只是缓解训练数据污染，不能根除——见 backtest.py 文档。
id: internet_early
title: 互联网早期（年份已核对）
verified: true
disclaimer: "年份已于 2026-10-02 由 Claude 对照公开资料核对（非专家审定）；stage/requires 为建模判断；同一事件存在多个日期口径。"
steps: 13
year_shift: 37          # 引擎看到的年份 = 真实年份 + 37；打分只用顺序与间隔，不受影响

# 名称别名：意图与真值名称里出现的键会被替换成值（长名优先）
alias_map:
  ARPANET: 联盟研究网
  TCP/IP: 通用互联协议
  NSFNET: 学术骨干网
  万维网: 超文本信息系统
  Mosaic: 图形化浏览器甲
  Netscape: 浏览器公司乙

start:
  template: group_evolution
  time_granularity: "2 年"
  start_year: 1969
  years_per_step: 2
  intent: >-
    1969 年，几家研究机构与政府资助方开始尝试把不同的计算机连成一个
    分组交换网络（ARPANET），各机构使用互不兼容的设备。请推演这个研究
    网络之后二十六年左右，技术、协议、组织与应用如何逐步演化。

milestones:
  - id: m_packet_net
    name: ARPANET 首次跨机构连通
    year: 1969
    aliases: [分组交换网络首次连通, 联盟研究网连通]
    stage: lab
  - id: m_protocol
    name: TCP/IP 成为网络标准协议
    year: 1983
    aliases: [统一互联协议, 通用互联协议成为标准]
    stage: developer
    requires: [m_packet_net]
  - id: m_backbone
    name: NSFNET 学术骨干网建成
    year: 1986
    aliases: [学术骨干网, 国家级骨干网]
    stage: developer
    requires: [m_protocol]
  - id: m_web
    name: 万维网公开可用
    year: 1991
    aliases: [超文本信息系统, 超文本网络]
    stage: expert
    requires: [m_protocol]
  - id: m_browser
    name: Mosaic 图形浏览器发布
    year: 1993
    aliases: [图形化浏览器, 图形浏览器]
    stage: consumer
    requires: [m_web]
  - id: m_commercial
    name: Netscape 上市，商业互联网热潮开始
    year: 1995
    aliases: [浏览器公司上市, 商业化热潮]
    stage: consumer
    requires: [m_browser]
