# 回测案例草稿：个人计算机兴起（第二十二轮 WP5 示例）
#
# 【重要】里程碑与年份由 Claude 凭记忆起草，**未经核对，不是事实来源**，
# 年份取整，请逐条核对后再把 verified 改为 true。
id: personal_computer
title: 个人计算机兴起（示例，未核对）
verified: false
disclaimer: "里程碑与年份为 Claude 凭记忆起草的示例，未经核对，不作为事实来源。"
steps: 8
year_shift: 41

alias_map:
  Altair: 机型甲
  "Apple II": 机型乙
  "IBM PC": 大厂机型丙
  Macintosh: 图形界面机型丁
  Windows: 图形界面系统戊

start:
  template: group_evolution
  time_granularity: "1 年"
  start_year: 1974
  years_per_step: 1.5
  intent: >-
    1974 年，微处理器刚刚出现，计算机仍主要是大型机和小型机，只有少数
    电子爱好者在自己组装小型计算机。请推演之后十五年左右，个人计算机
    这一产业如何从爱好者圈子走向大众市场，以及硬件、软件与商业模式的演化。

milestones:
  - id: m_kit
    name: Altair 爱好者套件上市
    year: 1975
    aliases: [爱好者套件, 机型甲]
    stage: lab
  - id: m_assembled
    name: Apple II 预装整机走向家庭与学校
    year: 1977
    aliases: [预装整机, 机型乙]
    stage: developer
    requires: [m_kit]
  - id: m_bigco
    name: IBM PC 发布，大厂入场并形成开放标准
    year: 1981
    aliases: [大厂入场, 大厂机型丙]
    stage: consumer
    requires: [m_assembled]
  - id: m_gui
    name: Macintosh 推出图形界面个人电脑
    year: 1984
    aliases: [图形界面个人电脑, 图形界面机型丁]
    stage: consumer
    requires: [m_bigco]
  - id: m_gui_mass
    name: Windows 3.0 让图形界面进入主流
    year: 1990
    aliases: [图形界面进入主流, 图形界面系统戊]
    stage: cheap_at_scale
    requires: [m_gui]
