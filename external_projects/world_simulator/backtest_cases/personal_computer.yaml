# 回测案例：个人计算机兴起（第二十二轮 WP5 示例；2026-10-02 已核对年份）
#
# 【核对记录】2026-10-02 由 Claude 对照公开资料逐条核对了**年份**（不是人工专家审定）：
#   1975 Altair 8800 —— 1975-01 登上 Popular Electronics 封面（套件上市）；
#   1977 Apple II    —— 1977-04 发布、当年上市销售；
#   1981 IBM PC      —— 1981-08-12；
#   1984 Macintosh   —— 1984-01 发布；
#   1990 Windows 3.0 —— 1990 年（公开资料普遍视为首个商业上成功的 PC 图形界面系统）。
# 里程碑的 stage / requires 是**建模判断**，不是史实，未做核对。
# 年份取整；"首次演示/发布/上市/出货"口径不同会差几个月。
#
# 【模拟跨度】原草稿 8 步×1.5 年 = 12 年（到 1986），最后一条 1990 在范围外、
# 永远测不到；已改为 11 步×1.5 年 = 16.5 年（到 1990.5）。
id: personal_computer
title: 个人计算机兴起（年份已核对）
verified: true
disclaimer: "年份已于 2026-10-02 由 Claude 对照公开资料核对（非专家审定）；stage/requires 为建模判断；同一事件存在多个日期口径。"
steps: 11
year_shift: 41

alias_map:
  Altair: 机型甲
  "Apple II": 机型乙
  "IBM PC": 大厂机型丙
  Macintosh: 图形界面机型丁
  Windows: 图形界面系统戊

start:
  template: group_evolution
  time_granularity: "1 年"
  start_year: 1974
  years_per_step: 1.5
  intent: >-
    1974 年，微处理器刚刚出现，计算机仍主要是大型机和小型机，只有少数
    电子爱好者在自己组装小型计算机。请推演之后十六年左右，个人计算机
    这一产业如何从爱好者圈子走向大众市场，以及硬件、软件与商业模式的演化。

milestones:
  - id: m_kit
    name: Altair 爱好者套件上市
    year: 1975
    aliases: [爱好者套件, 机型甲]
    stage: lab
  - id: m_assembled
    name: Apple II 预装整机走向家庭与学校
    year: 1977
    aliases: [预装整机, 机型乙]
    stage: developer
    requires: [m_kit]
  - id: m_bigco
    name: IBM PC 发布，大厂入场并形成开放标准
    year: 1981
    aliases: [大厂入场, 大厂机型丙]
    stage: consumer
    requires: [m_assembled]
  - id: m_gui
    name: Macintosh 推出图形界面个人电脑
    year: 1984
    aliases: [图形界面个人电脑, 图形界面机型丁]
    stage: consumer
    requires: [m_bigco]
  - id: m_gui_mass
    name: Windows 3.0 让图形界面进入主流
    year: 1990
    aliases: [图形界面进入主流, 图形界面系统戊]
    stage: cheap_at_scale
    requires: [m_gui]
