# 指标级回测案例（第二十四轮 A8）：全球每百人移动电话订阅数（S 曲线型，上限未知）
#
# 【数据来源】World Bank 指标 IT.CEL.SETS.P2（World 聚合，ITU 数据），2026-10-08 经 World Bank API 取得，
#   两次抓取（全范围与 1990–2012）数值一致。World 聚合在 2000–2004 年为空，序列分 1990–1999 与 2005–2025 两段。
# 【口径】t = 年，值 = 每百人订阅数（可超过 100：一人多卡）。没有物理上限，cap 上界按"历史最大值的 5 倍"机械给出。
# 【拟合窗口】window_years: 8 —— 只用截止日前 8 年内的点（避开 1990 年代早期的另一段增长），声明于看结果之前。
# 【验证状态】verified: false —— 数值经 API 摘要抓取，没有人工逐点核对。
