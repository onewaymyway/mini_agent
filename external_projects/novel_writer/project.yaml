# project.yaml — novel_writer 与 daemon 之间唯一的契约
#
# 完整字段参考 .claude/skills/external-project-manager/reference/project_yaml_schema.md
# （对齐 src/mini_agent/external_projects/manifest.py 的实际校验规则）。
#
# 里程碑进度（next_doc/novel_writer_external_project_plan.md 第 11 节）：
#   M0：create_novel / list_novels / health
#   M1（已完成，待确认）：引擎与 worker 已实现，但 run_novel 需要 --workspace 参数，
#       由 UI/CLI（tool_api.run_novel）拉起，**未**登记为 daemon 入口。
#   M6（已完成，待确认）：结局设计 / 全书终审 / 质量档位差异 / best-of-N / docx·epub 导出
#   M5（已完成，待确认）：advance_all_auto（批量推进 G2/G3 自动挡小说，每本至多 N 章）。
#       已登记为入口，但**没有**任何 cron 行：需要定时推进时手动在 daemon 中添加。

name: novel_writer

entrypoints:
  create_novel:
    cmd: "python entrypoints/create_novel.py"
    timeout_sec: 120
  list_novels:
    cmd: "python entrypoints/list_novels.py"
    timeout_sec: 120
  health:
    cmd: "python entrypoints/health.py"
    timeout_sec: 120
  advance_all_auto:
    cmd: "python entrypoints/advance_all_auto.py"
    timeout_sec: 7200
health_check:
  cmd: "python entrypoints/health.py"

resources:
  # 本项目不直接访问外部站点；LLM 调用由 mini_agent 宿主完成
  allowed_domains: []
  max_concurrency: 1

review:
  cadence: weekly
  enabled: false
