# project.yaml — novel_writer 与 daemon 之间唯一的契约
#
# 完整字段参考 .claude/skills/external-project-manager/reference/project_yaml_schema.md
# （对齐 src/mini_agent/external_projects/manifest.py 的实际校验规则）。
#
# 里程碑进度（next_doc/novel_writer_external_project_plan.md 第 11 节）：
#   M0（当前）：create_novel / list_novels / health
#   M1：run_novel（worker，运行一本书到下一个检查点/指定章数）
#   M5：advance_all_auto（批量推进所有自动挡小说，cron 默认关闭，opt-in）

name: novel_writer

entrypoints:
  create_novel:
    cmd: "python entrypoints/create_novel.py"
    timeout_sec: 120
  list_novels:
    cmd: "python entrypoints/list_novels.py"
    timeout_sec: 120
  health:
    cmd: "python entrypoints/health.py"
    timeout_sec: 120
health_check:
  cmd: "python entrypoints/health.py"

resources:
  # 本项目不直接访问外部站点；LLM 调用由 mini_agent 宿主完成
  allowed_domains: []
  max_concurrency: 1

review:
  cadence: weekly
  enabled: false
