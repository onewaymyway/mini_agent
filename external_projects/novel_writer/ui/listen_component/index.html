<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* 颜色与字体由 applyTheme() 从 Streamlit 主题写入，这里只给出浅色默认值 */
  :root {
    --bg: #FFFFFF; --bg2: #F0F2F6; --text: #31333F; --primary: #FF4B4B;
    --border: rgba(49, 51, 63, 0.2); --muted: rgba(49, 51, 63, 0.6); --on-primary: #FFFFFF;
    --font: "Source Sans Pro", "Source Sans 3", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: var(--font); font-size: 1rem; color: var(--text); padding: 2px 2px 6px; }
  button, select, input { font-family: var(--font); font-size: 0.95rem; color: var(--text); }
  button {
    background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem;
    padding: 0.25rem 0.75rem; cursor: pointer; min-height: 2.25rem;
  }
  button:hover { border-color: var(--primary); color: var(--primary); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  button.primary:hover { color: var(--on-primary); opacity: 0.9; }
  select, input[type=number], input[type=text] {
    background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem;
    padding: 0.35rem 0.6rem; min-height: 2.25rem; box-sizing: border-box;
  }
  select:focus, input:focus { border-color: var(--primary); outline: none; }
  input[type=number] { width: 4.5rem; }
  input[type=text] { width: 14rem; }
  #now { font-weight: 600; font-size: 1.1rem; margin-bottom: 2px; }
  #prog { color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
  #text { white-space: pre-wrap; line-height: 1.75; font-size: 1rem; background: var(--bg2);
          border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem 1rem;
          max-height: 9rem; overflow-y: auto; margin-bottom: 10px; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.5rem; }
  .label { color: var(--muted); font-size: 0.9rem; }
  #status { display: none; font-size: 0.9rem; padding: 6px 10px; margin: 4px 0 8px; border-radius: 0.5rem;
            border: 1px solid #e8a7a2; background: rgba(255, 75, 75, 0.08); color: #b3261e; }
  #status.info { border-color: var(--border); background: var(--bg2); color: var(--muted); }
  #found { color: var(--muted); font-size: 0.85rem; min-height: 1rem; margin-top: 2px; }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: 6px; }
</style>
</head>
<body>
<div id="now">准备就绪</div>
<div id="prog"></div>
<div id="text"></div>

<div class="row">
  <button id="prev">⏮ 上一章</button>
  <button id="toggle" class="primary" style="min-width:6rem">▶ 播放</button>
  <button id="stop">⏹ 停止</button>
  <button id="next">⏭ 下一章</button>
</div>

<div class="row">
  <button id="segPrev">◀ 上一段</button>
  <button id="segNext">下一段 ▶</button>
  <span class="label">本章第</span>
  <input id="segNum" type="number" min="1" value="1">
  <span class="label">段</span>
  <button id="segGo">跳转</button>
</div>

<div class="row">
  <input id="find" type="text" placeholder="输入文字，跳到含有它的段落">
  <button id="findGo">查找并跳转</button>
</div>
<div id="found"></div>
<div id="status"></div>

<div class="row">
  <label>语速 <select id="rate"></select></label>
  <label>音色 <select id="voice" style="max-width:260px"></select></label>
</div>
<div class="hint">语速与音色在下一段生效。切换标签页时浏览器可能暂停朗读，请保持本页可见。本书的收听位置（精确到段落）会自动记住。</div>

<script>
(function () {
  "use strict";
  const RATES = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3, 3.5, 4, 4.5, 5];
  const REPORT_EVERY = 5;   // 每播放 5 段回传一次位置，避免频繁触发 Streamlit 重跑
  const synth = window.speechSynthesis;
  const $ = id => document.getElementById(id);

  let started = false, DATA = null, idx = 0, state = "idle", token = 0;
  let lastCh = null, lastReportedIdx = -1, rate = 1, pendingVoice = "";

  // ---- Streamlit 组件协议 ----
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  // 高度随内容变化同步，避免控件加载或换行后被裁剪
  function fitHeight() {
    send("streamlit:setFrameHeight", { height: Math.ceil(document.body.scrollHeight) + 8 });
  }

  // ---- 主题：与 Streamlit 当前的浅色/深色主题保持一致 ----
  function isDarkColor(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return false;
    const n = parseInt(m[1], 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) < 128;
  }
  function applyTheme(t) {
    if (!t) return;
    const bg = t.backgroundColor || "#FFFFFF";
    const dark = isDarkColor(bg);
    const root = document.documentElement.style;
    root.setProperty("--bg", bg);
    root.setProperty("--bg2", t.secondaryBackgroundColor || (dark ? "#262730" : "#F0F2F6"));
    root.setProperty("--text", t.textColor || (dark ? "#FAFAFA" : "#31333F"));
    root.setProperty("--primary", t.primaryColor || "#FF4B4B");
    root.setProperty("--border", dark ? "rgba(250, 250, 250, 0.2)" : "rgba(49, 51, 63, 0.2)");
    root.setProperty("--muted", dark ? "rgba(250, 250, 250, 0.6)" : "rgba(49, 51, 63, 0.6)");
    root.setProperty("--on-primary", "#FFFFFF");
    if (t.font) root.setProperty("--font", '"' + t.font + '", system-ui, sans-serif');
    fitHeight();
  }

  // ---- 位置上报：{ch, seg}，seg 为该章内的段落下标 ----
  function report() {
    if (!DATA || !DATA.segments.length) return;
    const i = clampIdx(idx);
    const c = chapterOf(i);
    lastReportedIdx = i;
    lastCh = c.ch;
    send("streamlit:setComponentValue", {
      value: { ch: c.ch, seg: i - c.start, rate: rate, voice: $("voice").value || "" },
      dataType: "json"
    });
  }
  function maybeReport() {
    if (!DATA || !DATA.segments.length) return;
    const i = clampIdx(idx);
    if (chapterOf(i).ch !== lastCh || Math.abs(i - lastReportedIdx) >= REPORT_EVERY) report();
  }

  // ---- 章节/段落辅助 ----
  function clampIdx(i) { return Math.max(0, Math.min(i, DATA.segments.length - 1)); }
  function chapterIndexOf(i) {
    let k = 0;
    for (let j = 0; j < DATA.chapters.length; j++) if (DATA.chapters[j].start <= i) k = j;
    return k;
  }
  function chapterOf(i) { return DATA.chapters[chapterIndexOf(i)]; }
  function chapterRange(k) {
    const start = DATA.chapters[k].start;
    const end = k + 1 < DATA.chapters.length ? DATA.chapters[k + 1].start : DATA.segments.length;
    return { start: start, end: end };   // [start, end)
  }

  // ---- 显示 ----
  function render() {
    const segs = DATA.segments, chs = DATA.chapters;
    if (!segs.length) { $("now").textContent = "没有可朗读的正文"; return; }
    const i = clampIdx(idx);
    const k = chapterIndexOf(i), c = chs[k], r = chapterRange(k);
    $("now").textContent = "第" + c.ch + "章 " + c.title;
    $("prog").textContent = "可听章节 " + (k + 1) + "/" + chs.length + " · 全书段落 " + (i + 1) + "/" + segs.length
      + " · 本章第 " + (i - r.start + 1) + "/" + (r.end - r.start) + " 段"
      + " · 全书 " + ((i + 1) / segs.length * 100).toFixed(1) + "%";
    $("text").textContent = segs[i];
    $("segNum").max = r.end - r.start;
    if (document.activeElement !== $("segNum")) $("segNum").value = i - r.start + 1;
    $("toggle").textContent = state === "playing" ? "⏸ 暂停" : (state === "paused" ? "▶ 继续" : (state === "error" ? "↻ 重试" : "▶ 播放"));
    fitHeight();
  }
  function zhVoices() {
    return synth.getVoices().filter(v => (v.lang || "").toLowerCase().startsWith("zh"))
      .sort((a, b) => (/Natural/i.test(b.name) - /Natural/i.test(a.name)) || a.name.localeCompare(b.name));
  }
  function fillVoices() {
    const sel = $("voice"), prev = sel.value || pendingVoice;
    sel.innerHTML = "";
    const list = zhVoices();
    if (!list.length) {
      const o = document.createElement("option"); o.value = ""; o.textContent = "浏览器默认（未找到中文语音）";
      sel.appendChild(o);
    }
    list.forEach(v => {
      const o = document.createElement("option"); o.value = v.name; o.textContent = v.name + " (" + v.lang + ")";
      sel.appendChild(o);
    });
    if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
  }

  // ---- 播放队列与错误恢复 ----
  // 方案 A：播放当前段的同时，把后面 AHEAD 段提前交给浏览器的语音队列，段落之间基本无停顿。
  // 每次重新开始（跳转、停止、重试、改语速/音色）代次 gen 加一；旧队列残留的事件因代次不符被忽略。
  const AHEAD = 2;         // 当前段之后预排队的段数
  const MAX_RETRY = 5;
  let gen = 0;             // 队列代次
  let qNext = 0;           // 下一个待加入队列的段落下标
  let speakAt = 0;         // 开始排队的时间
  let startedAt = 0;       // 当前段 onstart 的时间（0 表示尚未开始出声）
  let retries = 0;         // 当前段已重试次数
  let retryPending = false;
  let keep = [];           // 保留最近的 utterance 引用，防止 Chrome 垃圾回收导致事件不触发

  const REASON_TEXT = {
    "network": "网络异常",
    "synthesis-failed": "语音合成失败",
    "synthesis-unavailable": "语音服务不可用",
    "language-unavailable": "没有可用的中文语音",
    "voice-unavailable": "所选音色不可用",
    "audio-busy": "音频设备忙",
    "audio-hardware": "音频设备异常",
    "stall": "朗读卡住了",
    "silent": "朗读意外停止"
  };
  function reasonText(r) { return REASON_TEXT[r] || ("未知错误（" + r + "）"); }

  function setStatus(msg, kind) {
    const el = $("status");
    el.textContent = msg || "";
    el.className = kind === "info" ? "info" : "";
    el.style.display = msg ? "block" : "none";
    fitHeight();
  }

  // 把第 i 段加入队列（属于代次 g）
  function speakOne(g, i) {
    const segs = DATA.segments;
    const u = new SpeechSynthesisUtterance(segs[i]);
    u.lang = "zh-CN";
    u.rate = rate;
    const name = $("voice").value;
    const v = zhVoices().find(x => x.name === name);
    if (v) { u.voice = v; u.lang = v.lang; }
    keep.push(u);
    if (keep.length > 8) keep.shift();

    u.onstart = () => {
      if (g !== gen) return;
      idx = i; startedAt = Date.now(); retries = 0;
      setStatus("");
      state = "playing";
      render();
      maybeReport();
      enqueueUpTo(g, i + AHEAD);   // 播放到哪里，就保证后面 AHEAD 段已经在队列里
    };
    u.onend = () => {
      if (g !== gen) return;
      if (i >= segs.length - 1) {
        // 读完全书：位置停在末段，不回到开头
        idx = segs.length - 1; state = "idle"; setStatus("");
        render(); report();
      }
    };
    u.onerror = e => {
      if (g !== gen) return;
      const reason = e.error || "unknown";
      if (reason === "interrupted" || reason === "canceled") return;   // 我们主动取消，不算错误
      handleFailure(g, reason, i);
    };
    synth.speak(u);
  }

  function enqueueUpTo(g, last) {
    const n = DATA.segments.length;
    while (qNext <= last && qNext < n) {
      speakOne(g, qNext);
      qNext++;
    }
  }

  // 从第 i 段开始（新的代次）。retry 为 true 时保留重试计数。
  function startQueue(i, retry) {
    gen++;
    const g = gen;
    synth.cancel();
    synth.resume();
    retryPending = false;
    if (!retry) retries = 0;
    idx = clampIdx(i);
    qNext = idx;
    startedAt = 0;
    speakAt = Date.now();
    state = "playing";
    render();
    maybeReport();
    enqueueUpTo(g, idx + AHEAD);
  }

  function handleFailure(g, reason, i) {
    if (g !== gen) return;
    // 不允许朗读是用户权限问题，重试没有意义
    if (reason === "not-allowed" || retries >= MAX_RETRY) { fail(reason); return; }
    retries++;
    retryPending = true;
    const delay = Math.min(1000 * Math.pow(2, retries - 1), 8000);
    gen++;                 // 作废当前队列的所有残留事件
    synth.cancel();
    setStatus("⚠ 朗读出错：" + reasonText(reason) + "。" + Math.round(delay / 1000) +
              " 秒后第 " + retries + "/" + MAX_RETRY + " 次重试…");
    const target = i;
    setTimeout(() => { startQueue(target, true); }, delay);
  }

  function fail(reason) {
    retryPending = false;
    gen++;
    synth.cancel();
    state = "error";
    if (reason === "not-allowed") {
      setStatus("⚠ 浏览器不允许朗读，请先点击页面任意处，再点「↻ 重试」。");
    } else {
      setStatus("⚠ 朗读失败（" + reasonText(reason) + "），已自动重试 " + MAX_RETRY +
                " 次仍无法继续。请检查网络后点「↻ 重试」，或用上一段/下一段跳过本段。");
    }
    render();
    report();
  }

  function speakFrom(i) {
    retries = 0;
    startQueue(i, false);
  }
  // 停止：保留当前位置，下次播放从这里接着读
  function stopKeepPosition() {
    gen++;
    retryPending = false;
    synth.cancel();
    state = "idle";
    setStatus("");
    render(); report();
  }

  // 看门狗：处理「不结束也不报错」的卡住、被系统暂停、以及从未开始出声的情况
  setInterval(() => {
    if (state !== "playing" || retryPending || !DATA || !DATA.segments.length) return;
    const now = Date.now();
    if (synth.paused) { synth.resume(); return; }          // 标签页或系统导致的暂停，尝试恢复
    const seg = DATA.segments[idx] || "";
    const expected = seg.length * 400 / rate + 8000;     // 按字数估算的最长朗读时间（毫秒）
    if (startedAt && now - startedAt > expected) { handleFailure(gen, "stall", idx); return; }
    if (!startedAt && now - speakAt > 10000) { handleFailure(gen, "stall", idx); return; }
    if (startedAt && !synth.speaking && !synth.pending && now - startedAt > 1500) {
      handleFailure(gen, "silent", idx);
    }
  }, 1500);

  // ---- 跳转 ----
  // 空闲时只移动位置；播放或暂停中则直接从新位置开始朗读
  function jumpTo(i) {
    idx = clampIdx(i);
    if (state === "idle") { render(); report(); }
    else { speakFrom(idx); report(); }
  }
  function jumpChapter(delta) {
    const k = chapterIndexOf(clampIdx(idx));
    const target = Math.max(0, Math.min(DATA.chapters.length - 1, k + delta));
    jumpTo(DATA.chapters[target].start);
  }
  function gotoInChapter() {
    const k = chapterIndexOf(clampIdx(idx)), r = chapterRange(k);
    let n = parseInt($("segNum").value, 10);
    if (isNaN(n)) return;
    n = Math.max(1, Math.min(r.end - r.start, n));
    jumpTo(r.start + n - 1);
  }
  function findText() {
    const q = $("find").value.trim();
    const found = $("found");
    if (!q) { found.textContent = "请输入要查找的文字。"; return; }
    const segs = DATA.segments, n = segs.length;
    // 从当前段之后开始向后查找，到末尾后回绕到开头
    for (let step = 1; step <= n; step++) {
      const j = (clampIdx(idx) + step) % n;
      if (segs[j].indexOf(q) >= 0) {
        const k = chapterIndexOf(j), r = chapterRange(k);
        found.textContent = "已跳转：第" + DATA.chapters[k].ch + "章 第 " + (j - r.start + 1) + " 段";
        jumpTo(j);
        return;
      }
    }
    found.textContent = "没有找到包含「" + q + "」的段落。";
  }

  function init(args) {
    DATA = args.payload || { segments: [], chapters: [] };
    rate = RATES.indexOf(Number(args.rate)) >= 0 ? Number(args.rate) : 1;
    pendingVoice = args.voice || "";

    // 恢复位置：resume_ch 对应的章节 + 章内段落下标（越界则夹到该章末段）
    idx = 0;
    if (args.resume_ch !== null && args.resume_ch !== undefined && DATA.chapters.length) {
      const k = DATA.chapters.findIndex(c => c.ch === Number(args.resume_ch));
      if (k >= 0) {
        const r = chapterRange(k);
        idx = r.start + Math.max(0, Math.min(Number(args.resume_seg) || 0, r.end - r.start - 1));
      }
    }

    const rsel = $("rate");
    RATES.forEach(r => {
      const o = document.createElement("option");
      o.value = String(r); o.textContent = r + "x";
      if (r === rate) o.selected = true;
      rsel.appendChild(o);
    });
    rsel.onchange = () => {
      rate = parseFloat(rsel.value); report();
      if (state === "playing") startQueue(idx, true);   // 队列中的段落按新语速重排
    };
    $("voice").onchange = () => {
      report();
      if (state === "playing") startQueue(idx, true);   // 队列中的段落按新音色重排
    };

    $("toggle").onclick = () => {
      if (state === "playing") { synth.pause(); state = "paused"; setStatus(""); render(); report(); }
      else if (state === "paused") { synth.resume(); state = "playing"; render(); }
      else { setStatus(""); speakFrom(idx); }   // idle 或 error：从当前段开始（error 时即手动重试）
    };
    $("stop").onclick = stopKeepPosition;
    $("prev").onclick = () => jumpChapter(-1);
    $("next").onclick = () => jumpChapter(1);
    $("segPrev").onclick = () => jumpTo(idx - 1);
    $("segNext").onclick = () => jumpTo(idx + 1);
    $("segGo").onclick = gotoInChapter;
    $("segNum").addEventListener("keydown", e => { if (e.key === "Enter") gotoInChapter(); });
    $("findGo").onclick = findText;
    $("find").addEventListener("keydown", e => { if (e.key === "Enter") findText(); });

    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = fillVoices;
    fillVoices();

    // 初始化不上报：起点来自已保存的位置，只有真正播放、跳转、改参数时才回传
    lastCh = DATA.segments.length ? chapterOf(clampIdx(idx)).ch : null;
    lastReportedIdx = idx;
    render();
  }

  // 只在首次渲染时初始化；之后 Streamlit 的重渲染会被忽略，避免播放中被打断。
  window.addEventListener("message", function (ev) {
    const d = ev.data;
    if (!d || d.type !== "streamlit:render") return;
    const theme = d.theme || (d.args && d.args.theme);
    if (theme) applyTheme(theme);
    if (started) return;   // 之后的重渲染只同步主题，不重建播放器
    started = true;
    init(d.args || {});
  });
  window.addEventListener("pagehide", function () {
    if (DATA && (state === "playing" || state === "paused")) report();
  });
  if (window.ResizeObserver) new ResizeObserver(fitHeight).observe(document.body);
  window.addEventListener("load", fitHeight);
  send("streamlit:componentReady", { apiVersion: 1 });
  fitHeight();
})();
</script>
</body>
</html>
