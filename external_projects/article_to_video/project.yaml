# project.yaml — article_to_video 与 daemon 之间的契约（字段规范见 src/mini_agent/external_projects/manifest.py）。
# 当前为 P4：导入、规划、口播稿、配音、分镜与画面渲染。默认不登记 cron；生图/语音属于高成本操作，由用户在界面或命令行手动触发。

name: article_to_video

entrypoints:
  import_article:
    cmd: "python entrypoints/import_article.py"
    timeout_sec: 120
  list_projects:
    cmd: "python entrypoints/list_projects.py"
    timeout_sec: 60

health_check:
  cmd: "python entrypoints/health.py"

resources:
  # 生图（Agnes，P4）与配音（edge-tts，P3）所需的域名；其余域名一律不访问
  allowed_domains:
    - apihub.agnes-ai.com
    - speech.platform.bing.com
  max_concurrency: 1

review:
  cadence: weekly
  enabled: false

# Streamlit 界面（端口 8507；8502–8506 已被其它项目占用）
web_app:
  entry: app.py
  port: 8507
